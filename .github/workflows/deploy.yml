name: Deploy StockiAPP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/stockiapp
            git fetch origin
            git checkout main
            git pull origin main
            go build -buildvcs=false -o stockiapp .
            cp stockiapp /srv/granempresa/app/granempresa
            systemctl restart granempresa
            systemctl status granempresa --no-pager
