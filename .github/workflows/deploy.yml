name: Deploy StockiAPP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/stockiapp
            git fetch origin
            git checkout main
            git pull origin main
            go build -buildvcs=false -o stockiapp_new .
            systemctl stop granempresa
            cp stockiapp_new /srv/granempresa/app/granempresa
            cp -r templates /srv/granempresa/app/
            cp -r static /srv/granempresa/app/
            cp -r docs /srv/granempresa/app/

            systemctl start granempresa
            systemctl status granempresa --no-pager
