<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{.Title}}</title>
        <style>
            :root {
                color-scheme: light;
                --label-width: {{.WidthMM}}mm;
                --label-height: {{.HeightMM}}mm;
                --paper-width: {{.PaperWidthMM}}mm;
                --paper-height: {{.PaperHeightMM}}mm;
                --label-gap: {{.GapMM}}mm;
                --ink: #111827;
                --muted: #596579;
                --line: #d9e0e8;
                font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }

            * { box-sizing: border-box; }

            html, body { margin: 0; min-height: 100%; background: #eef2f6; color: var(--ink); }

            .print-toolbar {
                width: min(760px, calc(100% - 32px));
                margin: 20px auto;
                padding: 16px;
                display: flex;
                gap: 16px;
                align-items: center;
                justify-content: space-between;
                border: 1px solid var(--line);
                border-radius: 12px;
                background: #fff;
            }

            .print-toolbar h1 { margin: 0 0 4px; font-size: 17px; }
            .print-toolbar p { margin: 0; color: var(--muted); font-size: 13px; }
            .print-actions { display: flex; gap: 8px; flex-wrap: wrap; }

            button, a {
                min-height: 44px;
                padding: 0 16px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                border: 1px solid #172554;
                border-radius: 8px;
                background: #172554;
                color: #fff;
                font: inherit;
                font-size: 14px;
                font-weight: 750;
                text-decoration: none;
                cursor: pointer;
            }

            a { border-color: var(--line); background: #fff; color: #263246; }

            .label-document {
                width: var(--paper-width);
                margin: 0 auto 32px;
                display: grid;
                gap: 12px;
            }

            .label-row {
                width: var(--paper-width);
                height: var(--paper-height);
                display: grid;
                grid-template-columns: repeat({{.Columns}}, var(--label-width));
                column-gap: var(--label-gap);
                background: #fff;
                overflow: hidden;
            }

            .label-card {
                width: var(--label-width);
                height: var(--label-height);
                padding: 3mm;
                display: grid;
                grid-template-rows: auto minmax(0, 1fr) auto auto auto;
                gap: 1.6mm;
                overflow: hidden;
                color: var(--ink);
            }

            .label-business {
                min-height: 9px;
                overflow: hidden;
                font-size: 7px;
                font-weight: 800;
                letter-spacing: .08em;
                line-height: 1.1;
                text-transform: uppercase;
                white-space: nowrap;
                text-overflow: ellipsis;
            }

            .label-name {
                margin: 0;
                display: -webkit-box;
                overflow: hidden;
                font-size: 11px;
                font-weight: 800;
                line-height: 1.12;
                -webkit-box-orient: vertical;
                -webkit-line-clamp: 2;
            }

            .label-price {
                padding: 1.3mm 0;
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                gap: 4px;
                border-top: 1px dashed #8793a5;
                border-bottom: 1px dashed #8793a5;
            }

            .label-price span { color: var(--muted); font-size: 6.5px; font-weight: 800; letter-spacing: .08em; }
            .label-price strong { font-size: 13px; line-height: 1; white-space: nowrap; }

            .label-barcode { display: grid; justify-items: center; align-content: center; gap: 1mm; min-height: 0; }
            .label-barcode img { width: 100%; max-height: 12mm; object-fit: fill; image-rendering: pixelated; }
            .label-code { max-width: 100%; overflow: hidden; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 7px; font-weight: 700; letter-spacing: .07em; white-space: nowrap; text-overflow: ellipsis; }

            .label-document.is-compact .label-card { padding: 1.8mm 2mm; gap: .7mm; }
            .label-document.is-compact .label-business { font-size: 5.8px; }
            .label-document.is-compact .label-name { font-size: 8px; -webkit-line-clamp: 1; }
            .label-document.is-compact .label-price { padding: .7mm 0; }
            .label-document.is-compact .label-price span { font-size: 5.4px; }
            .label-document.is-compact .label-price strong { font-size: 9.5px; }
            .label-document.is-compact .label-barcode { gap: .5mm; }
            .label-document.is-compact .label-barcode img { max-height: 7.2mm; }
            .label-document.is-compact .label-code { font-size: 5.8px; }

            @page { size: {{.PaperWidthMM}}mm {{.PaperHeightMM}}mm; margin: 0; }

            @media print {
                html, body { width: var(--paper-width); background: #fff; }
                .print-toolbar { display: none !important; }
                .label-document { width: var(--paper-width); margin: 0; gap: 0; }
                .label-row { break-after: page; page-break-after: always; }
                .label-row:last-child { break-after: auto; page-break-after: auto; }
            }
        </style>
    </head>
    <body>
        <section class="print-toolbar">
            <div>
                <h1>{{.Title}}</h1>
                <p>{{len .Items}} etiqueta(s) · {{.Columns}} por fila · lienzo {{.PaperWidthMM}} × {{.PaperHeightMM}} mm</p>
            </div>
            <div class="print-actions">
                <a href="/productos/etiquetas/masivas">Volver al lote</a>
                <button type="button" onclick="window.print()">Imprimir</button>
            </div>
        </section>
        <main class="label-document {{if eq .PaperClass "compact"}}is-compact{{end}}" aria-label="Documento de etiquetas">
            {{range .Rows}}
            <section class="label-row">
                {{range .}}
                <article class="label-card">
                    <div class="label-business">{{businessName $}}</div>
                    <h2 class="label-name">{{.Name}}</h2>
                    <div class="label-price"><span>PRECIO</span><strong>{{.Price}}</strong></div>
                    <div class="label-barcode">
                        <img src="{{.BarcodeDataURI}}" alt="Código de barras {{.ID}}" />
                        <div class="label-code">{{.ID}}</div>
                    </div>
                </article>
                {{end}}
            </section>
            {{end}}
        </main>
        {{if .AutoPrint}}
        <script>window.addEventListener("load", () => window.print());</script>
        {{end}}
    </body>
</html>
