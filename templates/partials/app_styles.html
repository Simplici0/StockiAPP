{{define "app_styles"}}
<link rel="icon" href="{{businessLogoPath .}}" />
<link rel="shortcut icon" href="{{businessLogoPath .}}" />
<link rel="apple-touch-icon" href="{{businessLogoPath .}}" />
<script>
    (function () {
        var storageKey = "stocki.theme";
        var root = document.documentElement;
        var theme = "light";
        try {
            var saved = window.localStorage.getItem(storageKey);
            if (saved === "light" || saved === "dark") {
                theme = saved;
            } else if (
                window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: dark)").matches
            ) {
                theme = "dark";
            }
        } catch (_) {}
        root.setAttribute("data-theme", theme);
        root.style.colorScheme = theme;
    })();
</script>
<style>
    :root {
      color-scheme: light;
      --font-sans: "Inter", "Segoe UI", "Helvetica Neue", sans-serif;

      --page-bg:        #eef2f7;
      --page-accent:    #dbeafe;
      --page-glow:      rgba(219, 234, 254, 0.45);
      --page-glow-soft: rgba(255, 255, 255, 0.55);
      --page-film:      rgba(255, 255, 255, 0.12);
      --surface-1:      #ffffff;
      --surface-2:      #eef2f7;
      --surface-3:      #dbe3ee;
      --surface-overlay: rgba(255, 255, 255, 0.97);
      --surface-gradient-start: #ffffff;
      --surface-gradient-end: #eef2f7;
      --surface-elevated: #ffffff;
      --input-surface:  #ffffff;
      --input-hover:    #ffffff;
      --input-focus:    #ffffff;
      --nav-surface:    #ffffff;
      --nav-soft:       rgba(2, 132, 199, 0.08);
      --nav-strong:     linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      --nav-panel:      #ffffff;

      --text:           #1e293b;
      --text-muted:     #334155;
      --text-soft:      #475569;
      --text-inverse:   #ffffff;

      --primary:        {{businessPrimaryColor .}};
      --primary-strong: {{businessPrimaryStrong .}};
      --primary-soft:   {{businessPrimarySoft .}};

      --secondary:      #1e293b;
      --secondary-soft: #dfe8f3;
      --focus-ring:     rgba(2, 132, 199, 0.16);
      --table-head-bg:  rgba(248, 250, 252, 0.98);
      --table-row-hover: rgba(226, 232, 240, 0.8);
      --chart-grid:     rgba(148, 163, 184, 0.22);
      --chart-axis:     rgba(148, 163, 184, 0.28);
      --chart-label:    #64748b;
      --chart-text:     #1e293b;
      --chart-track:    #eef2ff;
      --chart-accent:   #0284c7;
      --chart-highlight:#e85d3c;

      --success:        #059669;
      --warning:        #d97706;
      --danger:         #dc2626;
      --info:           #0284c7;
      --success-soft:   #ecfdf5;
      --warning-soft:   #fffbeb;
      --danger-soft:    #fef2f2;
      --info-soft:      #eff6ff;
      --status-loaned-soft: rgba(124, 58, 237, 0.16);
      --success-ink:    #065f46;
      --warning-ink:    #92400e;
      --danger-ink:     #991b1b;
      --info-ink:       #1e3a8a;
      --info-border:    rgba(14, 165, 201, 0.2);
      --primary-shadow: rgba(14, 165, 201, 0.22);

      --status-available-text: #047857;
      --status-available-border: rgba(5, 150, 105, 0.22);
      --status-reserved-text: #0369a1;
      --status-reserved-border: rgba(14, 165, 201, 0.22);
      --status-loaned-text: #6d28d9;
      --status-loaned-border: rgba(124, 58, 237, 0.22);
      --status-sold-text: #92400e;
      --status-sold-border: rgba(217, 119, 6, 0.22);
      --status-damaged-text: #991b1b;
      --status-damaged-border: rgba(220, 38, 38, 0.22);

      --border:         #e2e8f0;
      --border-strong:  #cbd5e1;

      --shadow-xs:  0 1px 2px rgba(15, 23, 42, 0.05), 0 12px 24px rgba(15, 23, 42, 0.05);
      --shadow-sm:  0 2px 8px rgba(15, 23, 42, 0.06), 0 16px 32px rgba(15, 23, 42, 0.06);
      --shadow-md:  0 8px 20px rgba(15, 23, 42, 0.08), 0 22px 44px rgba(15, 23, 42, 0.08);
      --overlay:    rgba(15, 23, 42, 0.54);

      --radius-sm:  10px;
      --radius-md:  16px;
      --radius-lg:  22px;
      --control-radius: 12px;
      --chip-radius: 999px;

      /* Tablet-first spacing scale */
      --space-1: 8px;
      --space-2: 12px;
      --space-3: 16px;
      --space-4: 20px;
      --space-5: 24px;
      --space-6: 32px;
      --page-gutter: 24px;
      --shell-width: min(1320px, calc(100% - (var(--page-gutter) * 2)));
      --surface-padding: 22px;
      --surface-padding-compact: 18px;
      --section-gap: 18px;

      --bg-page:        var(--page-bg);
      --bg-page-accent: var(--page-accent);
      --bg-page-glow:   var(--page-glow);
      --bg-page-glow-soft: var(--page-glow-soft);
      --bg-page-film:   var(--page-film);
      --bg-card:        var(--surface-1);
      --bg-card-muted:  var(--surface-2);
      --bg-card-strong: var(--surface-1);
      --bg-card-overlay: var(--surface-overlay);
      --bg-elevated:    var(--surface-elevated);
      --bg-input:       var(--input-surface);
      --bg-input-hover: var(--input-hover);
      --bg-input-focus: var(--input-focus);
      --bg-nav:         var(--nav-surface);
      --bg-nav-soft:    var(--nav-soft);
      --bg-nav-strong:  var(--nav-strong);
      --bg-nav-panel:   var(--nav-panel);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --page-bg:        #060e20;
      --page-accent:    #0f2235;
      --page-glow:      rgba(57, 184, 253, 0.12);
      --page-glow-soft: rgba(57, 184, 253, 0.06);
      --page-film:      rgba(255, 255, 255, 0.02);
      --surface-1:      #0f1930;
      --surface-2:      #16213e;
      --surface-3:      #1d2c48;
      --surface-overlay: rgba(12, 21, 34, 0.88);
      --surface-gradient-start: #0f1930;
      --surface-gradient-end: #16213e;
      --surface-elevated: #142235;
      --input-surface:  #101b2a;
      --input-hover:    #142235;
      --input-focus:    #16213e;
      --nav-surface:    #0f1930;
      --nav-soft:       rgba(57, 184, 253, 0.08);
      --nav-strong:     linear-gradient(180deg, #0f1930 0%, #0b1528 100%);
      --nav-panel:      #16213e;

      --text:           #e8eef7;
      --text-muted:     #9fb0c5;
      --text-soft:      #70839c;
      --text-inverse:   #060e20;

      --secondary:      #dee5ff;
      --secondary-soft: rgba(222, 229, 255, 0.14);
      --focus-ring:     rgba(79, 167, 255, 0.26);
      --table-head-bg:  rgba(15, 25, 48, 0.98);
      --table-row-hover: rgba(23, 38, 59, 0.9);
      --chart-grid:     rgba(222, 229, 255, 0.12);
      --chart-axis:     rgba(182, 196, 220, 0.2);
      --chart-label:    #8fa3bd;
      --chart-text:     #dde7f5;
      --chart-track:    rgba(74, 96, 128, 0.24);
      --chart-accent:   #39b8fd;
      --chart-highlight:#ff9a76;

      --success-soft:   rgba(5, 150, 105, 0.16);
      --warning-soft:   rgba(217, 119, 6, 0.16);
      --danger-soft:    rgba(220, 38, 38, 0.16);
      --info-soft:      rgba(14, 165, 201, 0.16);
      --status-loaned-soft: rgba(167, 139, 250, 0.16);
      --success-ink:    #bbf7d0;
      --warning-ink:    #fcd34d;
      --danger-ink:     #fca5a5;
      --info-ink:       #93c5fd;
      --info-border:    rgba(14, 165, 201, 0.28);
      --primary-shadow: rgba(57, 184, 253, 0.28);

      --status-available-text: #86efac;
      --status-available-border: rgba(16, 185, 129, 0.28);
      --status-reserved-text: #7dd3fc;
      --status-reserved-border: rgba(14, 165, 233, 0.28);
      --status-loaned-text: #d8b4fe;
      --status-loaned-border: rgba(167, 139, 250, 0.28);
      --status-sold-text: #fcd34d;
      --status-sold-border: rgba(245, 158, 11, 0.28);
      --status-damaged-text: #fca5a5;
      --status-damaged-border: rgba(248, 113, 113, 0.28);

      --border:         rgba(170, 193, 226, 0.12);
      --border-strong:  rgba(170, 193, 226, 0.22);

      --shadow-xs:  0 8px 18px rgba(1, 6, 14, 0.28), 0 1px 0 rgba(255, 255, 255, 0.02);
      --shadow-sm:  0 18px 36px rgba(1, 6, 14, 0.34), 0 1px 0 rgba(255, 255, 255, 0.02);
      --shadow-md:  0 26px 52px rgba(1, 6, 14, 0.42), 0 1px 0 rgba(255, 255, 255, 0.03);
      --overlay:    rgba(1, 6, 14, 0.72);

      --bg-page:        var(--page-bg);
      --bg-page-accent: var(--page-accent);
      --bg-page-glow:   var(--page-glow);
      --bg-page-glow-soft: var(--page-glow-soft);
      --bg-page-film:   var(--page-film);
      --bg-card:        var(--surface-1);
      --bg-card-muted:  var(--surface-2);
      --bg-card-strong: var(--surface-1);
      --bg-card-overlay: var(--surface-overlay);
      --bg-elevated:    var(--surface-elevated);
      --bg-input:       var(--input-surface);
      --bg-input-hover: var(--input-hover);
      --bg-input-focus: var(--input-focus);
      --bg-nav:         var(--nav-surface);
      --bg-nav-soft:    var(--nav-soft);
      --bg-nav-strong:  var(--nav-strong);
      --bg-nav-panel:   var(--nav-panel);
    }

    * {
      box-sizing: border-box;
      font-family: var(--font-sans);
    }

    html {
      background:
        radial-gradient(circle at top left, var(--bg-page-glow) 0, rgba(255, 255, 255, 0) 28rem),
        linear-gradient(180deg, var(--bg-page-accent) 0%, var(--bg-page) 28%, var(--bg-page) 100%);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 0 0, var(--bg-page-glow-soft), rgba(255, 255, 255, 0) 32rem),
        linear-gradient(180deg, var(--bg-page-film) 0%, rgba(255, 255, 255, 0) 22rem),
        var(--bg-page);
      transition: background 0.22s ease, color 0.22s ease;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ── Layout principal ── */
    .page-content {
      width: var(--shell-width);
      margin: 0 auto;
      padding: var(--space-4) 0 calc(var(--space-6) + 6px);
      animation: page-enter 280ms ease-out;
    }

    /* ── Tarjetas y superficies ── */
    .card,
    .section,
    .filters,
    .table-wrap,
    .import-panel,
    .export-panel,
    .export-section,
    .upload-preview,
    .summary-block,
    .modal {
      background: linear-gradient(180deg, var(--surface-gradient-start) 0%, var(--surface-gradient-end) 100%);
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-xs);
      backdrop-filter: none;
    }

    .card,
    .section,
    .filters,
    .import-panel,
    .export-panel,
    .export-section,
    .modal {
      border-radius: var(--radius-lg);
    }

    .table-wrap,
    .upload-preview {
      border-radius: var(--radius-lg);
    }

    .card,
    .section,
    .import-panel,
    .export-panel,
    .export-section {
      padding: var(--surface-padding);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .filters {
      padding: var(--surface-padding-compact) var(--surface-padding);
      gap: var(--space-3);
      border-color: var(--border-strong);
      background: linear-gradient(180deg, var(--surface-1) 0%, var(--surface-2) 100%);
    }

    /* ── Tipografía ── */
    h1 {
      margin: 0;
      color: var(--secondary);
      font-size: clamp(1.48rem, 2.2vw, 2rem);
      font-weight: 780;
      letter-spacing: -0.05em;
      line-height: 1.01;
    }

    h2 {
      margin: 0;
      color: var(--secondary);
      font-size: 1.06rem;
      font-weight: 760;
      letter-spacing: -0.025em;
    }

    h3 {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.73rem;
      font-weight: 750;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    p {
      color: var(--text-muted);
      line-height: 1.58;
      margin: 0;
      font-size: 0.94rem;
    }

    .page-header,
    .section-hd,
    .dashboard-toolbar,
    .label-toolbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-3);
      margin-bottom: var(--section-gap);
    }

    .page-header,
    .dashboard-toolbar,
    .label-toolbar {
      padding: 0;
    }

    .page-header-copy,
    .dashboard-toolbar-copy,
    .label-toolbar-copy,
    .section-hd-copy {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .page-header p,
    .dashboard-toolbar p,
    .label-toolbar p,
    .section-sub {
      color: var(--text-muted);
      font-size: 12.5px;
      line-height: 1.45;
      max-width: 68ch;
    }

    .section-hd {
      align-items: center;
      margin-bottom: 12px;
    }

    .section-title {
      color: var(--secondary);
      font-size: 1rem;
      font-weight: 750;
      letter-spacing: -0.02em;
    }

    .section-sub {
      margin: 0;
    }

    .dashboard-toolbar-actions,
    .label-toolbar-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .dashboard-toolbar-actions > *,
    .label-toolbar-actions > * {
      flex: 0 0 auto;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--secondary);
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Formularios ── */
    input,
    select,
    textarea,
    input[type="date"],
    input[type="search"],
    input[type="number"] {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border-radius: var(--control-radius);
      border: 1px solid var(--border-strong);
      background: var(--bg-input);
      color: var(--text);
      font-size: 14px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--text-soft);
      opacity: 1;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:hover,
    select:hover,
    textarea:hover {
      border-color: var(--border-strong);
      background: var(--bg-input-hover);
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--focus-ring), 0 1px 0 rgba(255, 255, 255, 0.5) inset;
      background: var(--bg-input-focus);
    }

    input:disabled,
    select:disabled,
    textarea:disabled,
    button:disabled,
    .button:disabled,
    a.button[aria-disabled="true"] {
      opacity: 0.58;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .customer-lookup {
      display: grid;
      gap: 12px;
    }

    .customer-lookup-search {
      position: relative;
      display: grid;
      gap: 6px;
    }

    .customer-lookup-helper {
      font-size: 12.5px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .customer-lookup-helper.active {
      color: var(--secondary);
      font-weight: 700;
    }

    .customer-lookup-results {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      z-index: 120;
      display: grid;
      gap: 6px;
      padding: 8px;
      border-radius: 14px;
      border: 1px solid var(--border-strong);
      background: var(--bg-elevated);
      box-shadow: var(--shadow-sm);
      max-height: 260px;
      overflow-y: auto;
    }

    .customer-lookup-result {
      display: grid;
      gap: 3px;
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-card-muted);
      color: var(--text);
      cursor: pointer;
    }

    .customer-lookup-result:hover,
    .customer-lookup-result:focus {
      border-color: var(--primary);
      background: var(--secondary-soft);
    }

    .customer-lookup-result strong {
      font-size: 13px;
      color: var(--secondary);
    }

    .customer-lookup-result span {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .toggle,
    .checkline {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
    }

    .toggle input[type="checkbox"],
    .checkline input[type="checkbox"] {
      width: 16px;
      min-width: 16px;
      height: 16px;
      min-height: 16px;
      margin: 0;
      padding: 0;
      flex: 0 0 auto;
      accent-color: var(--primary);
      box-shadow: none;
    }

    /* ── Botones base ── */
    button,
    .button,
    a.button,
    .nav-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 38px;
      padding: 0 14px;
      border-radius: var(--control-radius);
      border: 1px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      box-shadow: var(--shadow-xs);
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, color 0.15s ease;
      white-space: nowrap;
    }

    button:hover,
    .button:hover,
    a.button:hover {
      background: var(--bg-card-muted);
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    button.primary,
    .button.primary,
    a.button.primary {
      background: var(--primary);
      border-color: var(--primary-strong);
      color: var(--text-inverse);
      box-shadow: 0 8px 18px var(--primary-shadow);
    }

    button.primary:hover,
    .button.primary:hover,
    a.button.primary:hover {
      background: var(--primary-strong);
      box-shadow: 0 8px 16px var(--primary-shadow);
    }

    button.secondary,
    .button.secondary,
    a.button.secondary {
      background: var(--secondary-soft);
      border-color: var(--border-strong);
      color: var(--secondary);
      box-shadow: none;
    }

    button.secondary:hover,
    .button.secondary:hover,
    a.button.secondary:hover {
      background: rgba(2, 132, 199, 0.08);
      border-color: rgba(2, 132, 199, 0.18);
      color: var(--secondary);
    }

    button.danger,
    .button.danger,
    a.button.danger {
      background: var(--danger-soft);
      border-color: rgba(220, 38, 38, 0.24);
      color: var(--danger-ink);
      box-shadow: none;
    }

    button.danger:hover,
    .button.danger:hover,
    a.button.danger:hover {
      background: rgba(220, 38, 38, 0.14);
      border-color: rgba(220, 38, 38, 0.32);
      color: var(--danger-ink);
    }

    button.ghost,
    .button.ghost,
    a.button.ghost {
      background: transparent;
      border-color: transparent;
      color: var(--secondary);
      box-shadow: none;
    }

    button.ghost:hover,
    .button.ghost:hover,
    a.button.ghost:hover {
      background: var(--secondary-soft);
      border-color: var(--border-strong);
      color: var(--secondary);
    }

    /* ── Nav buttons ── */
    .nav-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 3px;
      width: fit-content;
      max-width: 100%;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--bg-card-overlay);
      box-shadow: var(--shadow-xs);
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 3px;
      width: fit-content;
      max-width: 100%;
      border-radius: var(--chip-radius);
      border: 1px solid var(--border-strong);
      background: var(--bg-card-overlay);
      box-shadow: var(--shadow-xs);
    }

    .nav-button {
      min-height: 34px;
      padding: 0 14px;
      border-radius: var(--chip-radius);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
    }

    .tab {
      min-height: 34px;
      padding: 0 14px;
      border-radius: var(--chip-radius);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
    }

    .nav-button:hover {
      background: var(--bg-card);
      color: var(--secondary);
      border-color: var(--border);
    }

    .tab:hover,
    .tab:focus-visible {
      background: var(--bg-card);
      color: var(--secondary);
      border-color: var(--border);
      outline: none;
    }

    .nav-button.active {
      background: var(--bg-card);
      color: var(--secondary);
      border-color: var(--border);
      box-shadow: var(--shadow-xs);
    }

    .tab.active {
      background: var(--bg-card);
      color: var(--secondary);
      border-color: var(--border);
      box-shadow: var(--shadow-xs);
    }

    /* ── Tabla ── */
    .table-wrap {
      overflow: auto;
      background: linear-gradient(180deg, var(--surface-gradient-start) 0%, var(--surface-gradient-end) 100%);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xs);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: var(--table-head-bg);
      border-bottom: 1px solid var(--border-strong);
    }

    th {
      padding: 12px 14px 11px;
      color: var(--secondary);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: left;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 1;
      backdrop-filter: none;
      box-shadow: inset 0 -1px 0 var(--border-strong);
    }

    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-strong);
      text-align: left;
      font-size: 13.5px;
      color: var(--text);
      vertical-align: middle;
    }

    tbody tr {
      transition: background 0.1s ease;
    }

    tbody tr:hover {
      background: var(--table-row-hover);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    /* ── Badges y estados ── */
    .badge,
    .status,
    .status-chip,
    .status-pill,
    .panel-summary-pill,
    .audit-pill,
    .invoice-source-pill,
    .confirm-badge,
    .credit-badge,
    .age-pill,
    .role-pill,
    .line-status,
    .report-status,
    .range-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 24px;
      padding: 4px 10px;
      border-radius: var(--chip-radius);
      font-size: 11.5px;
      font-weight: 700;
      line-height: 1;
      border: 1px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--secondary);
      box-shadow: var(--shadow-xs);
    }

    .status.available {
      color: var(--status-available-text);
      background: var(--success-soft);
      border-color: var(--status-available-border);
    }

    .status.reserved,
    .status.swapped {
      color: var(--status-reserved-text);
      background: var(--info-soft);
      border-color: var(--status-reserved-border);
    }

    .status.loaned {
      color: var(--status-loaned-text);
      background: var(--status-loaned-soft);
      border-color: var(--status-loaned-border);
    }

    .status.sold {
      color: var(--status-sold-text);
      background: var(--warning-soft);
      border-color: var(--status-sold-border);
    }

    .status.damaged {
      color: var(--status-damaged-text);
      background: var(--danger-soft);
      border-color: var(--status-damaged-border);
    }

    .status-pill.inactive,
    .role-pill.inactive,
    .line-status.inactive,
    .report-status.inactive,
    .audit-pill.inactive {
      background: var(--bg-card-muted);
      color: var(--text);
      border-color: var(--border-strong);
    }

    .status-pill.inactive,
    .role-pill.platform,
    .role-pill.tenant {
      letter-spacing: -0.01em;
    }

    /* ── Alertas y mensajes ── */
    .toast,
    .flash {
      padding: var(--space-2) 40px var(--space-2) var(--space-3);
      margin-bottom: var(--section-gap);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--info-border);
      background: var(--info-soft);
      color: var(--info-ink);
      position: relative;
    }

    .toast.success,
    .flash.success,
    .alert.success {
      border-color: var(--status-available-border);
      background: var(--success-soft);
      color: var(--success-ink);
    }

    .toast.warning,
    .flash.warning,
    .alert.warning {
      border-color: var(--status-sold-border);
      background: var(--warning-soft);
      color: var(--warning-ink);
    }

    .toast.error,
    .flash.error,
    .alert.error {
      border-color: var(--status-damaged-border);
      background: var(--danger-soft);
      color: var(--danger-ink);
    }

    .alert {
      padding: var(--space-2) 40px var(--space-2) var(--space-3);
      margin-bottom: var(--section-gap);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--info-border);
      background: var(--info-soft);
      color: var(--info-ink);
      position: relative;
    }

    .flash[data-persistent],
    .alert[data-persistent] {
      padding-right: 14px;
    }

    /* Botón de cierre para mensajes */
    .msg-close {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      width: 22px;
      min-height: 22px;
      padding: 0;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: currentColor;
      opacity: 0.45;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.15s ease, background 0.15s ease;
    }

    .msg-close:hover {
      opacity: 0.9;
      background: var(--secondary-soft);
    }

    @keyframes msg-fadeout {
      0%   { opacity: 1; max-height: 120px; margin-bottom: 14px; padding-top: 10px; padding-bottom: 10px; }
      100% { opacity: 0; max-height: 0;     margin-bottom: 0;    padding-top: 0;    padding-bottom: 0; }
    }

    .msg-dismissing {
      animation: msg-fadeout 0.28s ease forwards;
      overflow: hidden;
    }

    .error,
    .modal-error {
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 650;
      color: var(--danger-ink);
      background: var(--danger-soft);
      border: 1px solid rgba(220, 38, 38, 0.22);
      box-shadow: var(--shadow-xs);
    }

    .hint,
    .note,
    .settings-note,
    .tenant-scope-note,
    .report-note,
    .invoice-note,
    .receipt-note,
    .thermal-note,
    .thermal-footnote,
    .label-footnote,
    .sale-receipt-note,
    .fifo-note,
    .customer-lookup-helper,
    .modal-hint,
    .chart-note,
    .export-hint {
      color: var(--text-muted);
      font-size: 12.5px;
      line-height: 1.55;
      font-weight: 500;
    }

    .hint strong,
    .note strong,
    .modal-hint strong,
    .chart-note strong,
    .export-hint strong {
      color: var(--secondary);
      font-weight: 700;
    }

    .empty-state {
      padding: var(--surface-padding);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-strong);
      background:
        linear-gradient(180deg, var(--bg-card) 0%, var(--bg-card-muted) 100%);
      box-shadow: var(--shadow-xs);
      color: var(--text-muted);
    }

    .empty-state strong,
    .empty-state h3,
    .empty-state h4 {
      color: var(--secondary);
    }

    .empty-state p,
    .empty-state .modal-hint,
    .empty-state .hint,
    .empty-state .note {
      color: var(--text-muted);
    }

    /* ── Summary / legend ── */
    .summary-block {
      padding: 16px;
      border-radius: var(--radius-md);
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-xs);
    }

    @keyframes page-enter {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .state-list {
      display: grid;
      gap: 6px;
    }

    .state-list a,
    .legend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--bg-card);
      text-decoration: none;
      color: var(--text);
      font-size: 13px;
      transition: background 0.1s ease, border-color 0.1s ease, transform 0.1s ease;
      box-shadow: var(--shadow-xs);
    }

    .state-list a:hover {
      background: rgba(2, 132, 199, 0.07);
      border-color: rgba(2, 132, 199, 0.18);
      transform: translateY(-1px);
    }

    .state-list a.inactive,
    .legend-item.inactive {
      background: var(--bg-card-muted);
      color: var(--text-muted);
    }

    .state-list a.inactive:hover,
    .legend-item.inactive:hover {
      background: var(--bg-card);
      color: var(--text);
    }

    .legend-left {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    /* ── Gráficos ── */
    .line-chart {
      border-radius: var(--radius-md);
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-xs);
    }

    .range-popover {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      width: min(400px, 90vw);
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: var(--space-3);
      z-index: 30;
    }

    /* ── Modales ── */
    .modal-backdrop {
      background: var(--overlay);
      backdrop-filter: none;
    }

    .modal {
      padding: 0;
      overflow: hidden;
      border-radius: var(--radius-lg);
    }

    .modal-header,
    .modal-body {
      padding: var(--surface-padding-compact) var(--surface-padding);
    }

    .modal-header {
      background: var(--bg-card-muted);
      border-bottom: 1px solid var(--border-strong);
    }

    .modal-header h1,
    .modal-header h2,
    .modal-header h3 {
      color: var(--secondary);
    }

    .modal-subtitle {
      margin-top: 2px;
      color: var(--text-muted);
      font-size: 12.5px;
      line-height: 1.45;
    }

    .modal-close {
      width: 32px;
      min-height: 32px;
      padding: 0;
      border-radius: 50%;
      color: var(--text-muted);
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
    }

    .modal-grid {
      display: grid;
      gap: var(--space-3);
    }

    .modal-row {
      display: grid;
      gap: 8px;
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      margin-top: var(--space-2);
    }

    .modal-loading,
    .modal-empty {
      padding: var(--surface-padding);
      border-radius: var(--radius-md);
      border: 1px dashed var(--border-strong);
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.5;
    }

    /* ── Misc ── */
    .csv-columns span,
    .upload-status span,
    .example-list code {
      background: var(--secondary-soft);
      border: 1px solid var(--border);
      color: var(--secondary);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 12px;
    }

    .range-pill {
      padding: 4px 10px;
      font-size: 12px;
    }

    details.range-picker summary,
    .multi-select summary,
    details.settings-accordion summary,
    .dashboard-panel summary,
    details.accordion summary {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 42px;
      padding: 0 12px;
      list-style: none;
      cursor: pointer;
      color: var(--secondary);
      border-radius: var(--control-radius);
      border: 1px solid var(--border);
      background: var(--bg-input-focus);
      font-size: 13px;
      font-weight: 600;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }

    details.range-picker summary::-webkit-details-marker,
    .multi-select summary::-webkit-details-marker,
    details.settings-accordion summary::-webkit-details-marker,
    .dashboard-panel summary::-webkit-details-marker,
    details.accordion summary::-webkit-details-marker {
      display: none;
    }

    details.range-picker summary:hover,
    .multi-select summary:hover,
    details.settings-accordion summary:hover,
    .dashboard-panel summary:hover,
    details.accordion summary:hover {
      background: var(--secondary-soft);
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    details.range-picker[open] summary,
    .multi-select[open] summary,
    details.settings-accordion[open] summary,
    .dashboard-panel[open] summary,
    details.accordion[open] summary {
      background: var(--secondary-soft);
      border-color: var(--border-strong);
    }

    .modal-backdrop,
    .toast {
      will-change: auto;
    }

    @media (min-width: 1180px) {
      :root {
        --page-gutter: 32px;
        --surface-padding: 24px;
        --surface-padding-compact: 20px;
        --section-gap: 20px;
      }
    }

    @media (max-width: 767px) {
      :root {
        --page-gutter: 16px;
        --shell-width: min(100%, calc(100% - (var(--page-gutter) * 2)));
        --surface-padding: 16px;
        --surface-padding-compact: 14px;
        --section-gap: 14px;
      }

      h1 {
        font-size: 1.3rem;
      }

      th, td {
        padding: 9px 10px;
      }

      button,
      .button,
      a.button {
        min-height: 42px;
        font-size: 14px;
      }

      .filters,
      .card,
      .section {
        padding: var(--surface-padding);
      }

      .page-header,
      .section-hd,
      .dashboard-toolbar,
      .label-toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .actions,
      .export-actions,
      .export-button-row,
      .dashboard-toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      button,
      .button,
      a.button,
      .nav-button {
        width: 100%;
      }

      .nav-buttons {
        width: 100%;
        border-radius: var(--radius-sm);
      }
    }
</style>
<script>
    window.stockiTheme = window.stockiTheme || (function () {
        var storageKey = "stocki.theme";
        var root = document.documentElement;
        var listeners = [];

        function current() {
            return root.getAttribute("data-theme") === "dark" ? "dark" : "light";
        }

        function apply(theme, persist) {
            var next = theme === "dark" ? "dark" : "light";
            root.setAttribute("data-theme", next);
            root.style.colorScheme = next;
            if (persist) {
                try {
                    window.localStorage.setItem(storageKey, next);
                } catch (_) {}
            }
            window.dispatchEvent(
                new CustomEvent("stocki:theme-change", {
                    detail: { theme: next },
                }),
            );
            listeners.forEach(function (listener) {
                listener(next);
            });
            return next;
        }

        return {
            get: current,
            set: function (theme) {
                return apply(theme, true);
            },
            toggle: function () {
                return apply(current() === "dark" ? "light" : "dark", true);
            },
            onChange: function (handler) {
                if (typeof handler === "function") listeners.push(handler);
            },
        };
    })();

    document.addEventListener("DOMContentLoaded", function () {
        function dismissMsg(el) {
            el.classList.add("msg-dismissing");
            el.addEventListener(
                "animationend",
                function () {
                    el.remove();
                },
                { once: true },
            );
        }
        function addCloseBtn(el) {
            var btn = document.createElement("button");
            btn.className = "msg-close";
            btn.type = "button";
            btn.setAttribute("aria-label", "Cerrar");
            btn.innerHTML = "&times;";
            btn.addEventListener("click", function () {
                dismissMsg(el);
            });
            el.appendChild(btn);
        }
        // Flash: close button + auto-dismiss after 6s
        document
            .querySelectorAll(".flash:not([data-persistent])")
            .forEach(function (el) {
                addCloseBtn(el);
                setTimeout(function () {
                    if (el.isConnected) dismissMsg(el);
                }, 6000);
            });
        // Alert (info): close button only, no auto-dismiss
        document
            .querySelectorAll(".alert:not([data-persistent])")
            .forEach(function (el) {
                addCloseBtn(el);
            });
    });
</script>
