{{define "app_styles"}}
<link rel="icon" href="{{businessLogoPath .}}" />
<link rel="shortcut icon" href="{{businessLogoPath .}}" />
<link rel="apple-touch-icon" href="{{businessLogoPath .}}" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Montserrat:wght@600;700&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet" />
<script>
    (function () {
        var storageKey = "stocki.theme";
        var root = document.documentElement;
        var theme = "light";
        try {
            var saved = window.localStorage.getItem(storageKey);
            if (saved === "light" || saved === "dark") {
                theme = saved;
            } else if (
                window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: dark)").matches
            ) {
                theme = "dark";
            }
        } catch (_) {}
        root.setAttribute("data-theme", theme);
        root.style.colorScheme = theme;
    })();
</script>
<style>
    :root {
      color-scheme: light;
      --font-sans: "Inter", "Segoe UI", "Helvetica Neue", sans-serif;
      --font-heading: "Montserrat", "Inter", "Segoe UI", sans-serif;
      --font-mono: "Roboto Mono", "SFMono-Regular", Consolas, monospace;
      --font-normal: 400;
      --font-medium: 500;
      --font-bold: 700;
      --text-xs: 0.75rem;
      --text-sm: 0.875rem;
      --text-base: 1rem;
      --text-lg: 1.125rem;
      --text-xl: 1.5rem;

      --page-bg:        #ffffff;
      --page-accent:    #f5f7fa;
      --page-glow:      rgba(91, 91, 214, 0.08);
      --page-glow-soft: rgba(245, 247, 250, 0.72);
      --page-film:      rgba(255, 255, 255, 0.12);
      --surface-1:      #ffffff;
      --surface-2:      #f5f7fa;
      --surface-3:      #eceff3;
      --surface-overlay: rgba(255, 255, 255, 0.97);
      --surface-gradient-start: #ffffff;
      --surface-gradient-end: #f5f7fa;
      --surface-elevated: #ffffff;
      --input-surface:  #ffffff;
      --input-hover:    #ffffff;
      --input-focus:    #ffffff;
      --nav-surface:    #ffffff;
      --nav-soft:       rgba(91, 91, 214, 0.08);
      --nav-strong:     linear-gradient(180deg, #ffffff 0%, #f5f7fa 100%);
      --nav-panel:      #ffffff;

      --text:           #212121;
      --text-muted:     #6b7280;
      --text-soft:      #6b7280;
      --text-inverse:   #ffffff;

      --primary:        {{businessPrimaryColor .}};
      --primary-strong: {{businessPrimaryStrong .}};
      --primary-soft:   {{businessPrimarySoft .}};

      --secondary:      #212121;
      --secondary-soft: #f5f7fa;
      --focus-ring:     rgba(91, 91, 214, 0.22);
      --table-head-bg:  rgba(245, 247, 250, 0.98);
      --table-row-hover: rgba(245, 247, 250, 0.88);
      --chart-grid:     rgba(107, 114, 128, 0.2);
      --chart-axis:     rgba(107, 114, 128, 0.28);
      --chart-label:    #6b7280;
      --chart-text:     #212121;
      --chart-track:    #f5f7fa;
      --chart-accent:   #5b5bd6;
      --chart-highlight:#5b5bd6;

      --success:        #16a34a;
      --warning:        #f59e0b;
      --danger:         #dc2626;
      --info:           #5b5bd6;
      --success-soft:   rgba(22, 163, 74, 0.12);
      --warning-soft:   rgba(245, 158, 11, 0.14);
      --danger-soft:    rgba(220, 38, 38, 0.12);
      --info-soft:      rgba(91, 91, 214, 0.1);
      --status-loaned-soft: rgba(91, 91, 214, 0.12);
      --success-ink:    #16803c;
      --warning-ink:    #9a5e00;
      --danger-ink:     #b91c1c;
      --info-ink:       #4545b0;
      --info-border:    rgba(91, 91, 214, 0.24);
      --primary-shadow: rgba(91, 91, 214, 0.24);
      --secondary-hover: rgba(91, 91, 214, 0.08);
      --secondary-hover-border: rgba(91, 91, 214, 0.2);
      --danger-border: rgba(220, 38, 38, 0.24);
      --danger-hover: rgba(220, 38, 38, 0.14);
      --danger-hover-border: rgba(220, 38, 38, 0.32);
      --focus-inner: rgba(255, 255, 255, 0.5);
      --toggle-thumb-start: #ffffff;
      --toggle-thumb-end: #f5f7fa;
      --toggle-icon-sun: var(--warning);
      --toggle-icon-moon: var(--primary);
      --toggle-ring: rgba(91, 91, 214, 0.12);
      --print-paper: #ffffff;
      --print-ink: #212121;
      --print-border: #d6d9de;

      --status-available-text: var(--success-ink);
      --status-available-border: rgba(22, 163, 74, 0.26);
      --status-reserved-text: var(--info-ink);
      --status-reserved-border: rgba(91, 91, 214, 0.24);
      --status-loaned-text: var(--info-ink);
      --status-loaned-border: rgba(91, 91, 214, 0.24);
      --status-sold-text: var(--warning-ink);
      --status-sold-border: rgba(245, 158, 11, 0.26);
      --status-damaged-text: var(--danger-ink);
      --status-damaged-border: rgba(220, 38, 38, 0.24);

      --border:         #d6d9de;
      --border-strong:  #d6d9de;

      --shadow-xs:  0 1px 2px rgba(33, 33, 33, 0.05), 0 12px 24px rgba(33, 33, 33, 0.05);
      --shadow-sm:  0 2px 8px rgba(33, 33, 33, 0.06), 0 16px 32px rgba(33, 33, 33, 0.06);
      --shadow-md:  0 8px 20px rgba(33, 33, 33, 0.08), 0 22px 44px rgba(33, 33, 33, 0.08);
      --overlay:    rgba(33, 33, 33, 0.54);

      --radius-sm:  10px;
      --radius-md:  16px;
      --radius-lg:  22px;
      --control-radius: 12px;
      --chip-radius: 999px;

      /* Tablet-first spacing scale */
      --space-1: 8px;
      --space-2: 12px;
      --space-3: 16px;
      --space-4: 20px;
      --space-5: 24px;
      --space-6: 32px;
      --page-gutter: 24px;
      --shell-width: min(1320px, calc(100% - (var(--page-gutter) * 2)));
      --surface-padding: 22px;
      --surface-padding-compact: 18px;
      --section-gap: 18px;

      --bg-page:        var(--page-bg);
      --bg-page-accent: var(--page-accent);
      --bg-page-glow:   var(--page-glow);
      --bg-page-glow-soft: var(--page-glow-soft);
      --bg-page-film:   var(--page-film);
      --bg-card:        var(--surface-1);
      --bg-card-muted:  var(--surface-2);
      --bg-card-strong: var(--surface-1);
      --bg-card-overlay: var(--surface-overlay);
      --bg-elevated:    var(--surface-elevated);
      --bg-input:       var(--input-surface);
      --bg-input-hover: var(--input-hover);
      --bg-input-focus: var(--input-focus);
      --bg-nav:         var(--nav-surface);
      --bg-nav-soft:    var(--nav-soft);
      --bg-nav-strong:  var(--nav-strong);
      --bg-nav-panel:   var(--nav-panel);

      /* Aliases maintained for legacy page-local styles. */
      --bg:             var(--bg-page);
      --card:           var(--bg-card);
      --card-muted:     var(--bg-card-muted);
      --muted:          var(--text-muted);
      --shadow-soft:    var(--shadow-xs);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --page-bg:        #121212;
      --page-accent:    #121212;
      --page-glow:      rgba(209, 213, 219, 0.1);
      --page-glow-soft: rgba(209, 213, 219, 0.05);
      --page-film:      rgba(255, 255, 255, 0.02);
      --surface-1:      #1f1f1f;
      --surface-2:      #2d2d2d;
      --surface-3:      #2d2d2d;
      --surface-overlay: rgba(45, 45, 45, 0.96);
      --surface-gradient-start: #1f1f1f;
      --surface-gradient-end: #1f1f1f;
      --surface-elevated: #2d2d2d;
      --input-surface:  #1f1f1f;
      --input-hover:    #2d2d2d;
      --input-focus:    #2d2d2d;
      --nav-surface:    #1f1f1f;
      --nav-soft:       rgba(209, 213, 219, 0.14);
      --nav-strong:     linear-gradient(180deg, #1f1f1f 0%, #1f1f1f 100%);
      --nav-panel:      #2d2d2d;

      --text:           #e5e5e5;
      --text-muted:     #9ca3af;
      --text-soft:      #9ca3af;
      --text-inverse:   #121212;

      --primary:        #d1d5db;
      --primary-strong: #b6bcc4;
      --primary-soft:   rgba(209, 213, 219, 0.16);
      --secondary:      #e5e5e5;
      --secondary-soft: rgba(229, 229, 229, 0.1);
      --focus-ring:     rgba(209, 213, 219, 0.3);
      --table-head-bg:  #2d2d2d;
      --table-row-hover: rgba(45, 45, 45, 0.9);
      --chart-grid:     rgba(156, 163, 175, 0.2);
      --chart-axis:     rgba(156, 163, 175, 0.28);
      --chart-label:    #9ca3af;
      --chart-text:     #e5e5e5;
      --chart-track:    #2d2d2d;
      --chart-accent:   #d1d5db;
      --chart-highlight:#d1d5db;

      --success:        #00bf6b;
      --warning:        #fca327;
      --danger:         #ef4444;
      --info:           #d1d5db;
      --success-soft:   rgba(0, 191, 107, 0.16);
      --warning-soft:   rgba(252, 163, 39, 0.16);
      --danger-soft:    rgba(239, 68, 68, 0.16);
      --info-soft:      rgba(209, 213, 219, 0.16);
      --status-loaned-soft: rgba(209, 213, 219, 0.16);
      --success-ink:    #00bf6b;
      --warning-ink:    #fca327;
      --danger-ink:     #ef4444;
      --info-ink:       #d1d5db;
      --info-border:    rgba(209, 213, 219, 0.3);
      --primary-shadow: rgba(209, 213, 219, 0.28);
      --secondary-hover: rgba(209, 213, 219, 0.14);
      --secondary-hover-border: rgba(209, 213, 219, 0.3);
      --danger-border: rgba(239, 68, 68, 0.3);
      --danger-hover: rgba(239, 68, 68, 0.24);
      --danger-hover-border: rgba(239, 68, 68, 0.42);
      --focus-inner: rgba(255, 255, 255, 0.08);
      --toggle-thumb-start: #2d2d2d;
      --toggle-thumb-end: #1f1f1f;
      --toggle-icon-sun: var(--warning);
      --toggle-icon-moon: var(--primary);
      --toggle-ring: rgba(209, 213, 219, 0.14);

      --status-available-text: var(--success);
      --status-available-border: rgba(0, 191, 107, 0.3);
      --status-reserved-text: var(--primary);
      --status-reserved-border: rgba(209, 213, 219, 0.3);
      --status-loaned-text: var(--primary);
      --status-loaned-border: rgba(209, 213, 219, 0.3);
      --status-sold-text: var(--warning);
      --status-sold-border: rgba(252, 163, 39, 0.3);
      --status-damaged-text: var(--danger);
      --status-damaged-border: rgba(239, 68, 68, 0.3);

      --border:         #37474f;
      --border-strong:  #37474f;

      --shadow-xs:  0 8px 18px rgba(0, 0, 0, 0.28), 0 1px 0 rgba(255, 255, 255, 0.02);
      --shadow-sm:  0 18px 36px rgba(0, 0, 0, 0.34), 0 1px 0 rgba(255, 255, 255, 0.02);
      --shadow-md:  0 26px 52px rgba(0, 0, 0, 0.42), 0 1px 0 rgba(255, 255, 255, 0.03);
      --overlay:    rgba(0, 0, 0, 0.72);

      --bg-page:        var(--page-bg);
      --bg-page-accent: var(--page-accent);
      --bg-page-glow:   var(--page-glow);
      --bg-page-glow-soft: var(--page-glow-soft);
      --bg-page-film:   var(--page-film);
      --bg-card:        var(--surface-1);
      --bg-card-muted:  var(--surface-2);
      --bg-card-strong: var(--surface-1);
      --bg-card-overlay: var(--surface-overlay);
      --bg-elevated:    var(--surface-elevated);
      --bg-input:       var(--input-surface);
      --bg-input-hover: var(--input-hover);
      --bg-input-focus: var(--input-focus);
      --bg-nav:         var(--nav-surface);
      --bg-nav-soft:    var(--nav-soft);
      --bg-nav-strong:  var(--nav-strong);
      --bg-nav-panel:   var(--nav-panel);
    }

    * {
      box-sizing: border-box;
      font-family: var(--font-sans);
    }

    code,
    pre,
    kbd,
    samp {
      font-family: var(--font-mono);
    }

    html {
      min-width: 0;
      background:
        radial-gradient(circle at top left, var(--bg-page-glow) 0, rgba(255, 255, 255, 0) 28rem),
        linear-gradient(180deg, var(--bg-page-accent) 0%, var(--bg-page) 28%, var(--bg-page) 100%);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-width: 0;
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 0 0, var(--bg-page-glow-soft), rgba(255, 255, 255, 0) 32rem),
        linear-gradient(180deg, var(--bg-page-film) 0%, rgba(255, 255, 255, 0) 22rem),
        var(--bg-page);
      transition: background 0.22s ease, color 0.22s ease;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ── Layout principal ── */
    .page-content {
      width: var(--shell-width);
      margin: 0 auto;
      padding: var(--space-4) 0 calc(var(--space-6) + 6px);
      animation: page-enter 280ms ease-out;
    }

    /* ── Tarjetas y superficies ── */
    .card,
    .section,
    .filters,
    .table-wrap,
    .import-panel,
    .export-panel,
    .export-section,
    .upload-preview,
    .summary-block,
    .modal {
      background: linear-gradient(180deg, var(--surface-gradient-start) 0%, var(--surface-gradient-end) 100%);
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-xs);
      backdrop-filter: none;
    }

    .card,
    .section,
    .filters,
    .import-panel,
    .export-panel,
    .export-section,
    .modal {
      border-radius: var(--radius-lg);
    }

    .table-wrap,
    .upload-preview {
      border-radius: var(--radius-lg);
    }

    .card,
    .section,
    .import-panel,
    .export-panel,
    .export-section {
      padding: var(--surface-padding);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .filters {
      padding: var(--surface-padding-compact) var(--surface-padding);
      gap: var(--space-3);
      border-color: var(--border-strong);
      background: linear-gradient(180deg, var(--surface-1) 0%, var(--surface-2) 100%);
    }

    /* ── Componentes del sistema visual ── */
    .btn,
    .btn-primary,
    .btn-secondary,
    .btn-danger,
    .btn-ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-1);
      min-height: 44px;
      padding: 0 var(--space-3);
      border: 1px solid var(--border-strong);
      border-radius: var(--control-radius);
      color: var(--text);
      background: var(--bg-card);
      box-shadow: var(--shadow-xs);
      font-size: var(--text-sm);
      font-weight: var(--font-bold);
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, color 0.15s ease;
    }

    .btn:hover,
    .btn-secondary:hover {
      background: var(--bg-card-muted);
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    .btn-primary {
      border-color: var(--primary-strong);
      color: var(--text-inverse);
      background: var(--primary);
      box-shadow: 0 8px 18px var(--primary-shadow);
    }

    .btn-primary:hover {
      background: var(--primary-strong);
    }

    .btn-secondary {
      color: var(--secondary);
      background: var(--secondary-soft);
      box-shadow: none;
    }

    .btn-secondary:hover {
      color: var(--secondary);
      background: var(--secondary-hover);
      border-color: var(--secondary-hover-border);
    }

    .btn-danger {
      color: var(--danger-ink);
      background: var(--danger-soft);
      border-color: var(--danger-border);
      box-shadow: none;
    }

    .btn-danger:hover {
      color: var(--danger-ink);
      background: var(--danger-hover);
      border-color: var(--danger-hover-border);
    }

    .btn-ghost {
      color: var(--secondary);
      background: transparent;
      border-color: transparent;
      box-shadow: none;
    }

    .btn-ghost:hover {
      background: var(--secondary-soft);
    }

    .btn:focus-visible,
    .input:focus-visible,
    .tab:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .input {
      width: 100%;
      min-height: 44px;
    }

    .input-error {
      border-color: var(--danger) !important;
      box-shadow: 0 0 0 3px var(--danger-soft) !important;
    }

    .input-group {
      display: grid;
      gap: var(--space-1);
    }

    .alert {
      padding: var(--space-2) var(--space-3);
      border: 1px solid var(--info-border);
      border-radius: var(--radius-sm);
      color: var(--info-ink);
      background: var(--info-soft);
      font-size: var(--text-sm);
    }

    .alert-info { color: var(--info-ink); background: var(--info-soft); border-color: var(--info-border); }
    .alert-error { color: var(--danger-ink); background: var(--danger-soft); border-color: var(--danger-border); }
    .alert-success { color: var(--success-ink); background: var(--success-soft); border-color: var(--status-available-border); }

    .badge,
    .badge-success,
    .badge-warning,
    .badge-error {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 var(--space-2);
      border: 1px solid var(--border-strong);
      border-radius: var(--chip-radius);
      font-size: var(--text-xs);
      font-weight: var(--font-bold);
      white-space: nowrap;
    }

    .badge-success { color: var(--success-ink); background: var(--success-soft); border-color: var(--status-available-border); }
    .badge-warning { color: var(--warning-ink); background: var(--warning-soft); border-color: var(--status-sold-border); }
    .badge-error { color: var(--danger-ink); background: var(--danger-soft); border-color: var(--danger-border); }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-3);
      margin-bottom: var(--space-3);
    }

    .card-body { display: grid; gap: var(--space-3); }
    .page-title { font-size: var(--text-xl); font-weight: var(--font-bold); }

    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      flex-wrap: wrap;
      margin-bottom: var(--space-3);
      color: var(--text-muted);
      font-size: var(--text-xs);
    }
    .breadcrumbs a { color: var(--secondary); text-decoration: underline; text-underline-offset: 2px; }
    .breadcrumbs a:hover { color: var(--primary-strong); }
    .breadcrumbs-separator { color: var(--text-soft); }
    .breadcrumbs-current { color: var(--text); font-weight: var(--font-bold); }

    /* ── Módulo: detalle de préstamo de producto ── */
    .product-loan-detail__header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-2);
      flex-wrap: wrap;
    }

    .product-loan-detail__title { margin: 0; }
    .product-loan-detail__subtitle { margin: var(--space-1) 0 0; color: var(--text-muted); }
    .product-loan-detail__actions { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
    .product-loan-detail__close-label { font-size: var(--text-xs); }
    .product-loan-detail__history-title { margin-top: 0; }
    .product-loan-detail__layout { display: grid; gap: var(--space-5); }
    .product-loan-detail__grid { display: grid; gap: var(--space-3); grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .product-loan-detail__block {
      display: grid;
      gap: var(--space-1);
      padding: var(--space-3);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      background: var(--bg-card);
      box-shadow: var(--shadow-xs);
    }
    .product-loan-detail__block strong { color: var(--secondary); font-size: var(--text-xs); letter-spacing: 0.08em; text-transform: uppercase; }
    .product-loan-detail__block span,
    .product-loan-detail__block p { margin: 0; color: var(--text); line-height: 1.45; }
    .product-loan-detail__timeline { display: grid; gap: var(--space-2); }
    .product-loan-detail__timeline-item {
      display: grid;
      gap: var(--space-1);
      padding: var(--space-2) var(--space-3);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      background: var(--bg-card);
      box-shadow: var(--shadow-xs);
    }
    .product-loan-detail__timeline-meta { display: flex; gap: var(--space-2); flex-wrap: wrap; color: var(--text-muted); font-size: var(--text-xs); }
    .product-loan-detail__status {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 var(--space-2);
      border: 1px solid var(--border-strong);
      border-radius: var(--chip-radius);
      background: var(--bg-card);
      box-shadow: var(--shadow-xs);
      font-size: var(--text-xs);
      font-weight: var(--font-bold);
      white-space: nowrap;
    }
    .product-loan-detail__status.loaned { color: var(--status-loaned-text); border-color: var(--status-loaned-border); background: var(--status-loaned-soft); }
    .product-loan-detail__status.returned { color: var(--success-ink); border-color: var(--status-available-border); background: var(--success-soft); }
    .product-loan-detail__status.paid { color: var(--warning-ink); border-color: var(--status-sold-border); background: var(--warning-soft); }
    .product-loan-detail__status.cancelled { color: var(--text-muted); border-color: var(--border-strong); background: var(--bg-card-muted); }

    /* ── Módulo: auditoría ── */
    .audit-page__layout { display: grid; gap: var(--space-5); }
    .audit-page__filters { display: grid; gap: var(--space-2); grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); align-items: end; }
    .audit-page__actions { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; }
    .audit-page__table-wrap { overflow-x: auto; }
    .audit-page__table { width: 100%; border-collapse: collapse; }
    .audit-page__table th,
    .audit-page__table td { padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--border-strong); text-align: left; vertical-align: top; font-size: var(--text-sm); }
    .audit-page__table th { color: var(--secondary); font-size: var(--text-xs); letter-spacing: 0.06em; text-transform: uppercase; }
    .audit-page__pill { display: inline-flex; align-items: center; min-height: 28px; padding: 0 var(--space-2); border: 1px solid var(--border-strong); border-radius: var(--chip-radius); background: var(--bg-card); color: var(--secondary); font-size: var(--text-xs); font-weight: var(--font-bold); white-space: nowrap; }
    .audit-page__payload { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: var(--font-mono); font-size: var(--text-xs); color: var(--text); }

    /* ── Módulo: cambios ── */
    .swap-page__card { width: min(820px, 100%); margin: 0 auto; }
    .swap-page__card h1 { margin-bottom: var(--space-1); }
    .swap-page__card > p { margin-bottom: var(--space-2); }
    .swap-page__form { display: grid; gap: var(--space-2); }
    .swap-page__row { display: grid; gap: var(--space-2); grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
    .swap-page__section { display: grid; gap: var(--space-2); padding: var(--space-2); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-card-muted); }
    .swap-page__section h2 { margin: 0; color: var(--secondary); font-size: var(--text-sm); font-weight: var(--font-bold); letter-spacing: 0.06em; text-transform: uppercase; }
    .swap-page__multi-select { padding: var(--space-1) var(--space-2); border: 1px solid var(--border); border-radius: var(--control-radius); background: var(--bg-input); }
    .swap-page__multi-select summary { display: flex; align-items: center; justify-content: space-between; min-height: 34px; color: var(--text); cursor: pointer; font-size: var(--text-sm); list-style: none; }
    .swap-page__multi-select summary::-webkit-details-marker { display: none; }
    .swap-page__multi-select .summary-meta { color: var(--text-muted); font-size: var(--text-xs); }
    .swap-page__multi-select .options { display: grid; gap: 7px; max-height: 180px; margin-top: var(--space-1); overflow-y: auto; padding-right: 4px; }
    .swap-page__multi-select .option { display: flex; align-items: center; gap: var(--space-1); color: var(--text); font-size: var(--text-sm); }
    .swap-page__multi-select input[type="checkbox"] { width: auto; }
    .swap-page__selection-count { color: var(--info-ink); font-weight: var(--font-bold); }
    .swap-page__hint { color: var(--text-muted); font-size: var(--text-xs); }
    .swap-page__error { color: var(--danger-ink); font-size: var(--text-xs); }
    .swap-page__hidden { display: none; }
    .swap-page__actions { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; padding-top: var(--space-1); }
    .swap-page__note { color: var(--info-ink); font-size: var(--text-xs); font-weight: var(--font-bold); }

    /* ── Módulo: manual SSR ── */
    .manual-page { display: grid; gap: var(--space-3); }
    .manual-frame-wrap { min-height: calc(100vh - 140px); overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--bg-card); box-shadow: var(--shadow-sm); }
    .manual-frame { display: block; width: 100%; min-height: calc(100vh - 140px); border: 0; background: var(--bg-card-muted); }
    @media (max-width: 900px) {
      .manual-frame-wrap,
      .manual-frame { min-height: calc(100vh - 118px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn,
      .btn-primary,
      .btn-secondary,
      .btn-danger,
      .btn-ghost {
        transition: none;
      }
    }

    /* ── Tipografía ── */
    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    .page-title {
      font-family: var(--font-heading);
    }

    h1 {
      margin: 0;
      color: var(--secondary);
      font-size: clamp(1.48rem, 2.2vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.05em;
      line-height: 1.01;
    }

    h2 {
      margin: 0;
      color: var(--secondary);
      font-size: 1.06rem;
      font-weight: 600;
      letter-spacing: -0.025em;
    }

    h3 {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.73rem;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    p {
      color: var(--text-muted);
      line-height: 1.58;
      margin: 0;
      font-size: 0.94rem;
    }

    .page-header,
    .section-hd,
    .dashboard-toolbar,
    .label-toolbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-3);
      margin-bottom: var(--section-gap);
    }

    .page-header,
    .dashboard-toolbar,
    .label-toolbar {
      padding: 0;
    }

    .page-header-copy,
    .dashboard-toolbar-copy,
    .label-toolbar-copy,
    .section-hd-copy {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .page-header p,
    .dashboard-toolbar p,
    .label-toolbar p,
    .section-sub {
      color: var(--text-muted);
      font-size: 12.5px;
      line-height: 1.45;
      max-width: 68ch;
    }

    .section-hd {
      align-items: center;
      margin-bottom: 12px;
    }

    .section-title {
      color: var(--secondary);
      font-size: 1rem;
      font-weight: 750;
      letter-spacing: -0.02em;
    }

    .section-sub {
      margin: 0;
    }

    .dashboard-toolbar-actions,
    .label-toolbar-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .dashboard-toolbar-actions > *,
    .label-toolbar-actions > * {
      flex: 0 0 auto;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--secondary);
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Formularios ── */
    input,
    select,
    textarea,
    input[type="date"],
    input[type="search"],
    input[type="number"] {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border-radius: var(--control-radius);
      border: 1px solid var(--border-strong);
      background: var(--bg-input);
      color: var(--text);
      font-size: 14px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--text-soft);
      opacity: 1;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:hover,
    select:hover,
    textarea:hover {
      border-color: var(--border-strong);
      background: var(--bg-input-hover);
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--focus-ring), 0 1px 0 var(--focus-inner) inset;
      background: var(--bg-input-focus);
    }

    input:disabled,
    select:disabled,
    textarea:disabled,
    button:disabled,
    .button:disabled,
    a.button[aria-disabled="true"] {
      opacity: 0.58;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .customer-lookup {
      display: grid;
      gap: 12px;
    }

    .customer-lookup-search {
      position: relative;
      display: grid;
      gap: 6px;
    }

    .customer-lookup-helper {
      font-size: 12.5px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .customer-lookup-helper.active {
      color: var(--secondary);
      font-weight: 700;
    }

    .customer-lookup-results {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      z-index: 120;
      display: grid;
      gap: 6px;
      padding: 8px;
      border-radius: 14px;
      border: 1px solid var(--border-strong);
      background: var(--bg-elevated);
      box-shadow: var(--shadow-sm);
      max-height: 260px;
      overflow-y: auto;
    }

    .customer-lookup-result {
      display: grid;
      gap: 3px;
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-card-muted);
      color: var(--text);
      cursor: pointer;
    }

    .customer-lookup-result:hover,
    .customer-lookup-result:focus {
      border-color: var(--primary);
      background: var(--secondary-soft);
    }

    .customer-lookup-result strong {
      font-size: 13px;
      color: var(--secondary);
    }

    .customer-lookup-result span {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .customer-lookup-state {
      padding: 10px 12px;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .customer-lookup-state.error {
      color: var(--danger-ink);
    }

    .customer-lookup-state.empty {
      color: var(--text-muted);
    }

    .toggle,
    .checkline {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
    }

    .toggle input[type="checkbox"],
    .checkline input[type="checkbox"] {
      width: 16px;
      min-width: 16px;
      height: 16px;
      min-height: 16px;
      margin: 0;
      padding: 0;
      flex: 0 0 auto;
      accent-color: var(--primary);
      box-shadow: none;
    }

    /* ── Botones base ── */
    button,
    .button,
    a.button,
    .nav-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 38px;
      padding: 0 14px;
      border-radius: var(--control-radius);
      border: 1px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      box-shadow: var(--shadow-xs);
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, color 0.15s ease;
      white-space: nowrap;
    }

    button:hover,
    .button:hover,
    a.button:hover {
      background: var(--bg-card-muted);
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    button.primary,
    .button.primary,
    a.button.primary {
      background: var(--primary);
      border-color: var(--primary-strong);
      color: var(--text-inverse);
      box-shadow: 0 8px 18px var(--primary-shadow);
    }

    button.primary:hover,
    .button.primary:hover,
    a.button.primary:hover {
      background: var(--primary-strong);
      box-shadow: 0 8px 16px var(--primary-shadow);
    }

    button.secondary,
    .button.secondary,
    a.button.secondary {
      background: var(--secondary-soft);
      border-color: var(--border-strong);
      color: var(--secondary);
      box-shadow: none;
    }

    button.secondary:hover,
    .button.secondary:hover,
    a.button.secondary:hover {
      background: var(--secondary-hover);
      border-color: var(--secondary-hover-border);
      color: var(--secondary);
    }

    button.danger,
    .button.danger,
    a.button.danger {
      background: var(--danger-soft);
      border-color: var(--danger-border);
      color: var(--danger-ink);
      box-shadow: none;
    }

    button.danger:hover,
    .button.danger:hover,
    a.button.danger:hover {
      background: var(--danger-hover);
      border-color: var(--danger-hover-border);
      color: var(--danger-ink);
    }

    button.ghost,
    .button.ghost,
    a.button.ghost {
      background: transparent;
      border-color: transparent;
      color: var(--secondary);
      box-shadow: none;
    }

    button.ghost:hover,
    .button.ghost:hover,
    a.button.ghost:hover {
      background: var(--secondary-soft);
      border-color: var(--border-strong);
      color: var(--secondary);
    }

    /* ── Nav buttons ── */
    .nav-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 3px;
      width: fit-content;
      max-width: 100%;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--bg-card-overlay);
      box-shadow: var(--shadow-xs);
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 3px;
      width: fit-content;
      max-width: 100%;
      border-radius: var(--chip-radius);
      border: 1px solid var(--border-strong);
      background: var(--bg-card-overlay);
      box-shadow: var(--shadow-xs);
    }

    .nav-button {
      min-height: 34px;
      padding: 0 14px;
      border-radius: var(--chip-radius);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
    }

    .tab {
      min-height: 34px;
      padding: 0 14px;
      border-radius: var(--chip-radius);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
    }

    .nav-button:hover {
      background: var(--bg-card);
      color: var(--secondary);
      border-color: var(--border);
    }

    .tab:hover,
    .tab:focus-visible {
      background: var(--bg-card);
      color: var(--secondary);
      border-color: var(--border);
      outline: none;
    }

    .nav-button.active {
      background: var(--bg-card);
      color: var(--secondary);
      border-color: var(--border);
      box-shadow: var(--shadow-xs);
    }

    .tab.active {
      background: var(--bg-card);
      color: var(--secondary);
      border-color: var(--border);
      box-shadow: var(--shadow-xs);
    }

    /* ── Tabla ── */
    .table-wrap {
      overflow: auto;
      background: linear-gradient(180deg, var(--surface-gradient-start) 0%, var(--surface-gradient-end) 100%);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xs);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: var(--table-head-bg);
      border-bottom: 1px solid var(--border-strong);
    }

    th {
      padding: 12px 14px 11px;
      color: var(--secondary);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: left;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 1;
      backdrop-filter: none;
      box-shadow: inset 0 -1px 0 var(--border-strong);
    }

    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-strong);
      text-align: left;
      font-size: 13.5px;
      color: var(--text);
      vertical-align: middle;
    }

    tbody tr {
      transition: background 0.1s ease;
    }

    tbody tr:hover {
      background: var(--table-row-hover);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    /* ── Badges y estados ── */
    .badge,
    .status,
    .status-chip,
    .status-pill,
    .panel-summary-pill,
    .audit-pill,
    .invoice-source-pill,
    .confirm-badge,
    .credit-badge,
    .age-pill,
    .role-pill,
    .line-status,
    .report-status,
    .range-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 24px;
      padding: 4px 10px;
      border-radius: var(--chip-radius);
      font-size: 11.5px;
      font-weight: 700;
      line-height: 1;
      border: 1px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--secondary);
      box-shadow: var(--shadow-xs);
    }

    .status.available {
      color: var(--status-available-text);
      background: var(--success-soft);
      border-color: var(--status-available-border);
    }

    .status.reserved,
    .status.swapped {
      color: var(--status-reserved-text);
      background: var(--info-soft);
      border-color: var(--status-reserved-border);
    }

    .status.loaned {
      color: var(--status-loaned-text);
      background: var(--status-loaned-soft);
      border-color: var(--status-loaned-border);
    }

    .status.sold {
      color: var(--status-sold-text);
      background: var(--warning-soft);
      border-color: var(--status-sold-border);
    }

    .status.damaged {
      color: var(--status-damaged-text);
      background: var(--danger-soft);
      border-color: var(--status-damaged-border);
    }

    .status-pill.inactive,
    .role-pill.inactive,
    .line-status.inactive,
    .report-status.inactive,
    .audit-pill.inactive {
      background: var(--bg-card-muted);
      color: var(--text);
      border-color: var(--border-strong);
    }

    .status-pill.inactive,
    .role-pill.platform,
    .role-pill.tenant {
      letter-spacing: -0.01em;
    }

    /* ── Alertas y mensajes ── */
    .toast,
    .flash {
      padding: var(--space-2) 40px var(--space-2) var(--space-3);
      margin-bottom: var(--section-gap);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--info-border);
      background: var(--info-soft);
      color: var(--info-ink);
      position: relative;
    }

    .toast.success,
    .flash.success,
    .alert.success {
      border-color: var(--status-available-border);
      background: var(--success-soft);
      color: var(--success-ink);
    }

    .toast.warning,
    .flash.warning,
    .alert.warning {
      border-color: var(--status-sold-border);
      background: var(--warning-soft);
      color: var(--warning-ink);
    }

    .toast.error,
    .flash.error,
    .alert.error {
      border-color: var(--status-damaged-border);
      background: var(--danger-soft);
      color: var(--danger-ink);
    }

    .alert {
      padding: var(--space-2) 40px var(--space-2) var(--space-3);
      margin-bottom: var(--section-gap);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--info-border);
      background: var(--info-soft);
      color: var(--info-ink);
      position: relative;
    }

    .flash[data-persistent],
    .alert[data-persistent] {
      padding-right: 14px;
    }

    /* Botón de cierre para mensajes */
    .msg-close {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      width: 22px;
      min-height: 22px;
      padding: 0;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: currentColor;
      opacity: 0.45;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.15s ease, background 0.15s ease;
    }

    .msg-close:hover {
      opacity: 0.9;
      background: var(--secondary-soft);
    }

    @keyframes msg-fadeout {
      0%   { opacity: 1; max-height: 120px; margin-bottom: 14px; padding-top: 10px; padding-bottom: 10px; }
      100% { opacity: 0; max-height: 0;     margin-bottom: 0;    padding-top: 0;    padding-bottom: 0; }
    }

    .msg-dismissing {
      animation: msg-fadeout 0.28s ease forwards;
      overflow: hidden;
    }

    .error,
    .modal-error {
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 650;
      color: var(--danger-ink);
      background: var(--danger-soft);
      border: 1px solid var(--danger-border);
      box-shadow: var(--shadow-xs);
    }

    .hint,
    .note,
    .settings-note,
    .tenant-scope-note,
    .report-note,
    .invoice-note,
    .receipt-note,
    .thermal-note,
    .thermal-footnote,
    .label-footnote,
    .sale-receipt-note,
    .fifo-note,
    .customer-lookup-helper,
    .modal-hint,
    .chart-note,
    .export-hint {
      color: var(--text-muted);
      font-size: 12.5px;
      line-height: 1.55;
      font-weight: 500;
    }

    .hint strong,
    .note strong,
    .modal-hint strong,
    .chart-note strong,
    .export-hint strong {
      color: var(--secondary);
      font-weight: 700;
    }

    .empty-state {
      padding: var(--surface-padding);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-strong);
      background:
        linear-gradient(180deg, var(--bg-card) 0%, var(--bg-card-muted) 100%);
      box-shadow: var(--shadow-xs);
      color: var(--text-muted);
    }

    .empty-state strong,
    .empty-state h3,
    .empty-state h4 {
      color: var(--secondary);
    }

    .empty-state p,
    .empty-state .modal-hint,
    .empty-state .hint,
    .empty-state .note {
      color: var(--text-muted);
    }

    /* Estados reutilizables: carga, vacío, error y permisos */
    .state-loading,
    .state-empty,
    .state-error,
    .state-forbidden {
      display: grid;
      gap: var(--space-2);
      align-items: start;
      padding: var(--surface-padding);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--text-muted);
      box-shadow: var(--shadow-xs);
    }

    .state-loading {
      grid-template-columns: auto 1fr;
      align-items: center;
    }

    .state-icon,
    .state-loading-spinner {
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--secondary-soft);
      color: var(--secondary);
      font-weight: 800;
    }

    .state-loading-spinner {
      border: 3px solid var(--border-strong);
      border-top-color: var(--primary);
      animation: state-spin 0.8s linear infinite;
    }

    .state-empty h2,
    .state-empty h3,
    .state-error h2,
    .state-error h3,
    .state-forbidden h2,
    .state-forbidden h3 {
      margin: 0;
      color: var(--secondary);
    }

    .state-empty p,
    .state-error p,
    .state-forbidden p {
      margin: 0;
      color: var(--text-muted);
    }

    .state-error {
      border-color: var(--danger-border);
      background: var(--danger-soft);
      color: var(--danger-ink);
    }

    .state-error h2,
    .state-error h3,
    .state-error p {
      color: var(--danger-ink);
    }

    .state-forbidden {
      border-color: var(--status-sold-border);
      background: var(--warning-soft);
    }

    .state-actions {
      display: flex;
      gap: var(--space-2);
      flex-wrap: wrap;
      align-items: center;
    }

    .toast-region {
      position: fixed;
      right: var(--space-3);
      bottom: var(--space-3);
      z-index: 300;
      display: grid;
      gap: var(--space-2);
      width: min(360px, calc(100vw - 32px));
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      margin: 0;
      display: flex;
      align-items: flex-start;
      gap: var(--space-2);
      animation: toast-enter 0.18s ease both;
    }

    .toast-message { flex: 1; line-height: 1.45; }

    .toast-close {
      flex: 0 0 auto;
      min-width: 32px;
      min-height: 32px;
      padding: 0;
      border: 1px solid currentColor;
      border-radius: var(--radius-sm);
      background: transparent;
      color: currentColor;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }

    @keyframes state-spin { to { transform: rotate(360deg); } }
    @keyframes toast-enter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .state-loading-spinner,
      .toast { animation: none; }
    }

    /* ── Summary / legend ── */
    .summary-block {
      padding: 16px;
      border-radius: var(--radius-md);
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-xs);
    }

    @keyframes page-enter {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .state-list {
      display: grid;
      gap: 6px;
    }

    .state-list a,
    .legend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--bg-card);
      text-decoration: none;
      color: var(--text);
      font-size: 13px;
      transition: background 0.1s ease, border-color 0.1s ease, transform 0.1s ease;
      box-shadow: var(--shadow-xs);
    }

    .state-list a:hover {
      background: var(--secondary-hover);
      border-color: var(--secondary-hover-border);
      transform: translateY(-1px);
    }

    .state-list a.inactive,
    .legend-item.inactive {
      background: var(--bg-card-muted);
      color: var(--text-muted);
    }

    .state-list a.inactive:hover,
    .legend-item.inactive:hover {
      background: var(--bg-card);
      color: var(--text);
    }

    .legend-left {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    /* ── Gráficos ── */
    .line-chart {
      border-radius: var(--radius-md);
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-xs);
    }

    .range-popover {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      width: min(400px, 90vw);
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: var(--space-3);
      z-index: 30;
    }

    /* ── Modales ── */
    .modal-backdrop {
      background: var(--overlay);
      backdrop-filter: none;
    }

    .modal {
      padding: 0;
      overflow: hidden;
      border-radius: var(--radius-lg);
    }

    .modal-header,
    .modal-body {
      padding: var(--surface-padding-compact) var(--surface-padding);
    }

    .modal-header {
      background: var(--bg-card-muted);
      border-bottom: 1px solid var(--border-strong);
    }

    .modal-header h1,
    .modal-header h2,
    .modal-header h3 {
      color: var(--secondary);
    }

    .modal-subtitle {
      margin-top: 2px;
      color: var(--text-muted);
      font-size: 12.5px;
      line-height: 1.45;
    }

    .modal-close {
      width: 32px;
      min-height: 32px;
      padding: 0;
      border-radius: 50%;
      color: var(--text-muted);
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
    }

    .modal-grid {
      display: grid;
      gap: var(--space-3);
    }

    .modal-row {
      display: grid;
      gap: 8px;
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      margin-top: var(--space-2);
    }

    .modal-loading,
    .modal-empty {
      padding: var(--surface-padding);
      border-radius: var(--radius-md);
      border: 1px dashed var(--border-strong);
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.5;
    }

    /* ── Misc ── */
    .csv-columns span,
    .upload-status span,
    .example-list code {
      background: var(--secondary-soft);
      border: 1px solid var(--border);
      color: var(--secondary);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 12px;
    }

    .range-pill {
      padding: 4px 10px;
      font-size: 12px;
    }

    details.range-picker summary,
    .multi-select summary,
    details.settings-accordion summary,
    .dashboard-panel summary,
    details.accordion summary {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 42px;
      padding: 0 12px;
      list-style: none;
      cursor: pointer;
      color: var(--secondary);
      border-radius: var(--control-radius);
      border: 1px solid var(--border);
      background: var(--bg-input-focus);
      font-size: 13px;
      font-weight: 600;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }

    details.range-picker summary::-webkit-details-marker,
    .multi-select summary::-webkit-details-marker,
    details.settings-accordion summary::-webkit-details-marker,
    .dashboard-panel summary::-webkit-details-marker,
    details.accordion summary::-webkit-details-marker {
      display: none;
    }

    details.range-picker summary:hover,
    .multi-select summary:hover,
    details.settings-accordion summary:hover,
    .dashboard-panel summary:hover,
    details.accordion summary:hover {
      background: var(--secondary-soft);
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    details.range-picker[open] summary,
    .multi-select[open] summary,
    details.settings-accordion[open] summary,
    .dashboard-panel[open] summary,
    details.accordion[open] summary {
      background: var(--secondary-soft);
      border-color: var(--border-strong);
    }

    .modal-backdrop,
    .toast {
      will-change: auto;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition: none !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (min-width: 1180px) {
      :root {
        --page-gutter: 32px;
        --surface-padding: 24px;
        --surface-padding-compact: 20px;
        --section-gap: 20px;
      }
    }

    @media (max-width: 767px) {
      :root {
        --page-gutter: 16px;
        --shell-width: min(100%, calc(100% - (var(--page-gutter) * 2)));
        --surface-padding: 16px;
        --surface-padding-compact: 14px;
        --section-gap: 14px;
      }

      h1 {
        font-size: 1.3rem;
      }

      /* Evita el zoom automático de Safari al enfocar controles. */
      input,
      select,
      textarea,
      input[type="date"],
      input[type="search"],
      input[type="number"] {
        font-size: 16px;
      }

      th, td {
        padding: 9px 10px;
      }

      button,
      .button,
      a.button {
        min-height: 44px;
        font-size: 14px;
      }

      .filters,
      .card,
      .section {
        padding: var(--surface-padding);
      }

      .page-header,
      .section-hd,
      .dashboard-toolbar,
      .label-toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .export-actions,
      .export-button-row,
      .dashboard-toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      button,
      .button,
      a.button {
        width: auto;
      }

      form > .actions,
      .modal-actions,
      .export-actions,
      .export-button-row {
        display: grid;
        grid-template-columns: 1fr;
      }

      form > .actions > button,
      form > .actions > .button,
      .modal-actions > button,
      .modal-actions > .button,
      .export-actions > button,
      .export-actions > .button,
      .export-button-row > button,
      .export-button-row > .button {
        width: 100%;
      }

      .nav-buttons {
        width: 100%;
        border-radius: var(--radius-sm);
      }

      .nav-button {
        width: auto;
        min-height: 40px;
      }

      .table-wrap,
      .upload-preview,
      .audit-table-wrap,
      .report-table-wrap {
        max-width: 100%;
        overflow-x: auto;
        overscroll-behavior-x: contain;
        -webkit-overflow-scrolling: touch;
      }

      .table-wrap:focus-visible,
      .upload-preview:focus-visible,
      .audit-table-wrap:focus-visible,
      .report-table-wrap:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 2px;
      }

      .toggle input[type="checkbox"],
      .checkline input[type="checkbox"] {
        width: 20px;
        min-width: 20px;
        height: 20px;
        min-height: 20px;
      }
    }
</style>
<script>
    window.stockiTheme = window.stockiTheme || (function () {
        var storageKey = "stocki.theme";
        var root = document.documentElement;
        var listeners = [];

        function current() {
            return root.getAttribute("data-theme") === "dark" ? "dark" : "light";
        }

        function apply(theme, persist) {
            var next = theme === "dark" ? "dark" : "light";
            root.setAttribute("data-theme", next);
            root.style.colorScheme = next;
            if (persist) {
                try {
                    window.localStorage.setItem(storageKey, next);
                } catch (_) {}
            }
            window.dispatchEvent(
                new CustomEvent("stocki:theme-change", {
                    detail: { theme: next },
                }),
            );
            listeners.forEach(function (listener) {
                listener(next);
            });
            return next;
        }

        return {
            get: current,
            set: function (theme) {
                return apply(theme, true);
            },
            toggle: function () {
                return apply(current() === "dark" ? "light" : "dark", true);
            },
            onChange: function (handler) {
                if (typeof handler === "function") listeners.push(handler);
            },
        };
    })();

    document.addEventListener("DOMContentLoaded", function () {
        window.showToast = window.showToast || function (message, type) {
            var region = document.getElementById("toast-region");
            if (!region) {
                region = document.createElement("div");
                region.id = "toast-region";
                region.className = "toast-region";
                region.setAttribute("aria-live", "polite");
                region.setAttribute("aria-atomic", "false");
                document.body.appendChild(region);
            }
            var kind = ["success", "error", "info", "warning"].indexOf(type) >= 0 ? type : "info";
            var toast = document.createElement("div");
            toast.className = "toast " + kind;
            toast.setAttribute("role", kind === "error" ? "alert" : "status");
            var text = document.createElement("span");
            text.className = "toast-message";
            text.textContent = String(message || "");
            var close = document.createElement("button");
            close.type = "button";
            close.className = "toast-close";
            close.setAttribute("aria-label", "Cerrar notificación");
            close.textContent = "×";
            var remove = function () {
                if (toast.isConnected) toast.remove();
            };
            close.addEventListener("click", remove);
            toast.append(text, close);
            region.appendChild(toast);
            window.setTimeout(remove, 5000);
        };

        function dismissMsg(el) {
            el.classList.add("msg-dismissing");
            el.addEventListener(
                "animationend",
                function () {
                    el.remove();
                },
                { once: true },
            );
        }
        document.querySelectorAll(".flash, .alert").forEach(function (el) {
            if (!el.hasAttribute("role")) {
                el.setAttribute("role", el.classList.contains("error") ? "alert" : "status");
            }
            if (!el.hasAttribute("aria-live")) {
                el.setAttribute("aria-live", el.classList.contains("error") ? "assertive" : "polite");
            }
        });
        function addCloseBtn(el) {
            var btn = document.createElement("button");
            btn.className = "msg-close";
            btn.type = "button";
            btn.setAttribute("aria-label", "Cerrar");
            btn.innerHTML = "&times;";
            btn.addEventListener("click", function () {
                dismissMsg(el);
            });
            el.appendChild(btn);
        }
        // Flash: close button + auto-dismiss after 6s
        document
            .querySelectorAll(".flash:not([data-persistent])")
            .forEach(function (el) {
                addCloseBtn(el);
                setTimeout(function () {
                    if (el.isConnected) dismissMsg(el);
                }, 6000);
            });
        // Alert (info): close button only, no auto-dismiss
        document
            .querySelectorAll(".alert:not([data-persistent])")
            .forEach(function (el) {
                addCloseBtn(el);
            });
    });
</script>
