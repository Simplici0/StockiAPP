{{define "app_styles"}}
<link rel="icon" href="{{businessLogoPath .}}" />
<link rel="shortcut icon" href="{{businessLogoPath .}}" />
<link rel="apple-touch-icon" href="{{businessLogoPath .}}" />
<script>
    (function () {
        var storageKey = "stocki.theme";
        var root = document.documentElement;
        var theme = "light";
        try {
            var saved = window.localStorage.getItem(storageKey);
            if (saved === "light" || saved === "dark") {
                theme = saved;
            } else if (
                window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: dark)").matches
            ) {
                theme = "dark";
            }
        } catch (_) {}
        root.setAttribute("data-theme", theme);
        root.style.colorScheme = theme;
    })();
</script>
<style>
    :root {
      color-scheme: light;
      --font-sans: "Inter", "Segoe UI", "Helvetica Neue", sans-serif;

      --bg-page:        #edf2f6;
      --bg-page-accent: #dce8f4;
      --bg-page-glow:   rgba(255, 255, 255, 0.9);
      --bg-page-glow-soft: rgba(255, 255, 255, 0.6);
      --bg-page-film: rgba(255, 255, 255, 0.12);
      --bg-card:        rgba(255, 255, 255, 0.94);
      --bg-card-muted:  #f6f9fc;
      --bg-card-strong: #ffffff;
      --bg-card-overlay: rgba(255, 255, 255, 0.82);
      --surface-gradient-start: rgba(255,255,255,0.96);
      --surface-gradient-end: rgba(248,250,252,0.96);
      --bg-elevated:    rgba(255, 255, 255, 0.98);
      --bg-input:       rgba(255, 255, 255, 0.9);
      --bg-input-hover: #ffffff;
      --bg-input-focus: #ffffff;
      --bg-nav:         #0b1d36;
      --bg-nav-soft:    rgba(255,255,255,0.08);
      --bg-nav-strong:  linear-gradient(180deg, rgba(9, 23, 43, 0.98) 0%, rgba(11, 29, 54, 0.96) 100%);
      --bg-nav-panel:   rgba(255,255,255,0.96);

      --text:           #102133;
      --text-muted:     #4f627e;
      --text-soft:      #7f92aa;
      --text-inverse:   #ffffff;

      --primary:        {{businessPrimaryColor .}};
      --primary-strong: {{businessPrimaryStrong .}};
      --primary-soft:   {{businessPrimarySoft .}};

      --secondary:      #102a4c;
      --secondary-soft: #e7eef7;
      --focus-ring:     rgba(14, 165, 201, 0.14);
      --table-head-bg:  rgba(246, 249, 252, 0.96);
      --table-row-hover: rgba(231, 238, 247, 0.7);
      --chart-grid:     rgba(16, 33, 51, 0.12);
      --chart-axis:     rgba(16, 42, 76, 0.18);
      --chart-label:    #6f6a65;
      --chart-text:     #26221f;
      --chart-track:    #eef2ff;
      --chart-accent:   #2c6bed;
      --chart-highlight:#e85d3c;

      --success:        #059669;
      --warning:        #d97706;
      --danger:         #dc2626;
      --success-soft:   #ecfdf5;
      --warning-soft:   #fffbeb;
      --danger-soft:    #fef2f2;
      --info-soft:      #eff6ff;

      --border:         rgba(16, 42, 76, 0.1);
      --border-strong:  rgba(16, 42, 76, 0.18);

      --shadow-xs:  0 1px 2px rgba(9, 20, 40, 0.04), 0 10px 24px rgba(9, 20, 40, 0.04);
      --shadow-sm:  0 2px 10px rgba(9, 20, 40, 0.06), 0 18px 36px rgba(9, 20, 40, 0.05);
      --shadow-md:  0 8px 24px rgba(9, 20, 40, 0.08), 0 24px 50px rgba(9, 20, 40, 0.08);

      --radius-sm:  10px;
      --radius-md:  16px;
      --radius-lg:  22px;

      /* Tablet-first spacing scale */
      --space-1: 8px;
      --space-2: 12px;
      --space-3: 16px;
      --space-4: 20px;
      --space-5: 24px;
      --space-6: 32px;
      --page-gutter: 24px;
      --surface-padding: 22px;
      --surface-padding-compact: 18px;
      --section-gap: 18px;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg-page:        #07121d;
      --bg-page-accent: #0f2235;
      --bg-page-glow:   rgba(47, 121, 201, 0.16);
      --bg-page-glow-soft: rgba(22, 55, 94, 0.22);
      --bg-page-film: rgba(255, 255, 255, 0.02);
      --bg-card:        rgba(12, 21, 34, 0.92);
      --bg-card-muted:  #101b2a;
      --bg-card-strong: #142235;
      --bg-card-overlay: rgba(12, 21, 34, 0.78);
      --surface-gradient-start: rgba(20, 34, 53, 0.96);
      --surface-gradient-end: rgba(16, 27, 42, 0.96);
      --bg-elevated:    rgba(15, 25, 40, 0.98);
      --bg-input:       rgba(13, 24, 38, 0.96);
      --bg-input-hover: rgba(16, 30, 47, 0.98);
      --bg-input-focus: rgba(18, 34, 54, 0.98);
      --bg-nav:         #061019;
      --bg-nav-soft:    rgba(255,255,255,0.06);
      --bg-nav-strong:  linear-gradient(180deg, rgba(6, 16, 25, 0.98) 0%, rgba(8, 20, 32, 0.96) 100%);
      --bg-nav-panel:   rgba(11, 20, 33, 0.98);

      --text:           #e8eef7;
      --text-muted:     #9fb0c5;
      --text-soft:      #70839c;
      --text-inverse:   #f8fbff;

      --secondary:      #f3f7fc;
      --secondary-soft: rgba(147, 170, 204, 0.14);
      --focus-ring:     rgba(79, 167, 255, 0.26);
      --table-head-bg:  rgba(16, 27, 42, 0.98);
      --table-row-hover: rgba(23, 38, 59, 0.9);
      --chart-grid:     rgba(232, 238, 247, 0.12);
      --chart-axis:     rgba(182, 196, 220, 0.2);
      --chart-label:    #8fa3bd;
      --chart-text:     #dde7f5;
      --chart-track:    rgba(74, 96, 128, 0.24);
      --chart-accent:   #4f9dff;
      --chart-highlight:#ff9a76;

      --success-soft:   rgba(5, 150, 105, 0.16);
      --warning-soft:   rgba(217, 119, 6, 0.16);
      --danger-soft:    rgba(220, 38, 38, 0.16);
      --info-soft:      rgba(14, 165, 201, 0.16);

      --border:         rgba(170, 193, 226, 0.12);
      --border-strong:  rgba(170, 193, 226, 0.22);

      --shadow-xs:  0 8px 18px rgba(1, 6, 14, 0.28), 0 1px 0 rgba(255, 255, 255, 0.02);
      --shadow-sm:  0 18px 36px rgba(1, 6, 14, 0.34), 0 1px 0 rgba(255, 255, 255, 0.02);
      --shadow-md:  0 26px 52px rgba(1, 6, 14, 0.42), 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    * {
      box-sizing: border-box;
      font-family: var(--font-sans);
    }

    html {
      background:
        radial-gradient(circle at top left, var(--bg-page-glow) 0, rgba(255, 255, 255, 0) 28rem),
        linear-gradient(180deg, var(--bg-page-accent) 0%, var(--bg-page) 28%, var(--bg-page) 100%);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 0 0, var(--bg-page-glow-soft), rgba(255, 255, 255, 0) 32rem),
        linear-gradient(180deg, var(--bg-page-film) 0%, rgba(255, 255, 255, 0) 22rem),
        var(--bg-page);
      transition: background 0.22s ease, color 0.22s ease;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ── Layout principal ── */
    .page-content {
      width: min(1280px, calc(100% - (var(--page-gutter) * 2)));
      margin: 0 auto;
      padding: var(--space-5) 0 calc(var(--space-6) + 10px);
      animation: page-enter 280ms ease-out;
    }

    /* ── Tarjetas y superficies ── */
    .card,
    .section,
    .filters,
    .table-wrap,
    .import-panel,
    .export-panel,
    .export-section,
    .upload-preview,
    .summary-block,
    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-xs);
      backdrop-filter: blur(10px);
    }

    .card,
    .section,
    .filters,
    .import-panel,
    .export-panel,
    .export-section,
    .modal {
      border-radius: var(--radius-lg);
    }

    .table-wrap,
    .upload-preview {
      border-radius: var(--radius-lg);
    }

    .card,
    .section,
    .import-panel,
    .export-panel,
    .export-section {
      padding: var(--surface-padding);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .filters {
      padding: var(--surface-padding-compact) var(--surface-padding);
      gap: var(--space-3);
      border-color: var(--border);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96) 0%, rgba(246, 249, 252, 0.98) 100%);
    }

    /* ── Tipografía ── */
    h1 {
      margin: 0;
      color: var(--secondary);
      font-size: clamp(1.45rem, 2.3vw, 2.05rem);
      font-weight: 760;
      letter-spacing: -0.045em;
      line-height: 1.02;
    }

    h2 {
      margin: 0;
      color: var(--secondary);
      font-size: 1.02rem;
      font-weight: 740;
      letter-spacing: -0.02em;
    }

    h3 {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    p {
      color: var(--text-muted);
      line-height: 1.55;
      margin: 0;
      font-size: 0.92rem;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Formularios ── */
    input,
    select,
    textarea,
    input[type="date"],
    input[type="search"],
    input[type="number"] {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text);
      font-size: 14px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:hover,
    select:hover,
    textarea:hover {
      border-color: var(--primary);
      background: var(--bg-input-hover);
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--focus-ring);
      background: var(--bg-input-focus);
    }

    .customer-lookup {
      display: grid;
      gap: 12px;
    }

    .customer-lookup-search {
      position: relative;
      display: grid;
      gap: 6px;
    }

    .customer-lookup-helper {
      font-size: 12px;
      color: var(--text-soft);
      font-weight: 500;
    }

    .customer-lookup-helper.active {
      color: var(--secondary);
      font-weight: 700;
    }

    .customer-lookup-results {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      z-index: 120;
      display: grid;
      gap: 6px;
      padding: 8px;
      border-radius: 14px;
      border: 1px solid var(--border-strong);
      background: var(--bg-elevated);
      box-shadow: var(--shadow-sm);
      max-height: 260px;
      overflow-y: auto;
    }

    .customer-lookup-result {
      display: grid;
      gap: 3px;
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(16, 42, 76, 0.08);
      background: var(--bg-card-muted);
      color: var(--text);
      cursor: pointer;
    }

    .customer-lookup-result:hover,
    .customer-lookup-result:focus {
      border-color: rgba(14, 165, 201, 0.26);
      background: var(--secondary-soft);
    }

    .customer-lookup-result strong {
      font-size: 13px;
      color: var(--secondary);
    }

    .customer-lookup-result span {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .toggle,
    .checkline {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
    }

    .toggle input[type="checkbox"],
    .checkline input[type="checkbox"] {
      width: 16px;
      min-width: 16px;
      height: 16px;
      min-height: 16px;
      margin: 0;
      padding: 0;
      flex: 0 0 auto;
      accent-color: var(--primary);
      box-shadow: none;
    }

    /* ── Botones base ── */
    button,
    .button,
    a.button,
    .nav-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 38px;
      padding: 0 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--secondary);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      white-space: nowrap;
    }

    button:hover,
    .button:hover,
    a.button:hover {
      background: var(--secondary-soft);
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    button.primary,
    .button.primary,
    a.button.primary {
      background: var(--primary);
      border-color: var(--primary-strong);
      color: var(--text-inverse);
      box-shadow: 0 8px 18px rgba(14, 165, 201, 0.22);
    }

    button.primary:hover,
    .button.primary:hover,
    a.button.primary:hover {
      background: var(--primary-strong);
      box-shadow: 0 4px 12px rgba(14, 165, 201, 0.32);
    }

    button.secondary,
    .button.secondary,
    a.button.secondary {
      background: var(--secondary-soft);
      border-color: rgba(13, 43, 85, 0.12);
      color: var(--secondary);
    }

    button.secondary:hover,
    .button.secondary:hover,
    a.button.secondary:hover {
      background: rgba(13, 43, 85, 0.08);
    }

    button.danger,
    .button.danger,
    a.button.danger {
      background: #fef2f2;
      border-color: rgba(220, 38, 38, 0.2);
      color: var(--danger);
    }

    button.danger:hover,
    .button.danger:hover,
    a.button.danger:hover {
      background: rgba(220, 38, 38, 0.08);
    }

    /* ── Nav buttons ── */
    .nav-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 4px;
      width: fit-content;
      max-width: 100%;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-card-overlay);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    }

    .nav-button {
      min-height: 34px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
    }

    .nav-button:hover {
      background: var(--bg-card);
      color: var(--secondary);
      border-color: var(--border);
    }

    .nav-button.active {
      background: var(--bg-card);
      color: var(--secondary);
      border-color: var(--border);
      box-shadow: var(--shadow-xs);
    }

    /* ── Tabla ── */
    .table-wrap {
      overflow: auto;
      background: linear-gradient(180deg, var(--surface-gradient-start) 0%, var(--surface-gradient-end) 100%);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: var(--table-head-bg);
      border-bottom: 1px solid var(--border);
    }

    th {
      padding: 10px 14px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      text-align: left;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 1;
      backdrop-filter: blur(8px);
    }

    td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      font-size: 13.5px;
      color: var(--text);
      vertical-align: middle;
    }

    tbody tr {
      transition: background 0.1s ease;
    }

    tbody tr:hover {
      background: var(--table-row-hover);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    /* ── Badges y estados ── */
    .badge,
    .status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      border: 1px solid transparent;
    }

    .status.available {
      color: #047857;
      background: var(--success-soft);
      border-color: rgba(5, 150, 105, 0.2);
    }

    .status.reserved,
    .status.swapped {
      color: #0369a1;
      background: var(--info-soft);
      border-color: rgba(14, 165, 201, 0.2);
    }

    .status.loaned {
      color: #7c3aed;
      background: rgba(124, 58, 237, 0.16);
      border-color: rgba(124, 58, 237, 0.2);
    }

    .status.sold {
      color: #92400e;
      background: var(--warning-soft);
      border-color: rgba(217, 119, 6, 0.2);
    }

    .status.damaged {
      color: #991b1b;
      background: var(--danger-soft);
      border-color: rgba(220, 38, 38, 0.2);
    }

    /* ── Alertas y mensajes ── */
    .flash {
      padding: var(--space-2) 40px var(--space-2) var(--space-3);
      margin-bottom: var(--section-gap);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      border: 1px solid rgba(5, 150, 105, 0.2);
      background: var(--success-soft);
      color: #065f46;
      position: relative;
    }

    .alert {
      padding: var(--space-2) 40px var(--space-2) var(--space-3);
      margin-bottom: var(--section-gap);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      border: 1px solid rgba(14, 165, 201, 0.2);
      background: var(--info-soft);
      color: #1e3a8a;
      position: relative;
    }

    .flash[data-persistent],
    .alert[data-persistent] {
      padding-right: 14px;
    }

    /* Botón de cierre para mensajes */
    .msg-close {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      width: 22px;
      min-height: 22px;
      padding: 0;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: currentColor;
      opacity: 0.45;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.15s ease, background 0.15s ease;
    }

    .msg-close:hover {
      opacity: 0.9;
      background: rgba(0, 0, 0, 0.08);
    }

    @keyframes msg-fadeout {
      0%   { opacity: 1; max-height: 120px; margin-bottom: 14px; padding-top: 10px; padding-bottom: 10px; }
      100% { opacity: 0; max-height: 0;     margin-bottom: 0;    padding-top: 0;    padding-bottom: 0; }
    }

    .msg-dismissing {
      animation: msg-fadeout 0.28s ease forwards;
      overflow: hidden;
    }

    .error,
    .modal-error {
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      color: #991b1b;
      background: var(--danger-soft);
      border: 1px solid rgba(220, 38, 38, 0.2);
    }

    .hint,
    .note,
    .modal-hint,
    .chart-note,
    .export-hint {
      color: var(--text-soft);
      font-size: 12px;
      line-height: 1.5;
      font-weight: 500;
    }

    /* ── Summary / legend ── */
    .summary-block {
      padding: 16px;
      border-radius: var(--radius-md);
      background: var(--bg-card-overlay);
      border: 1px solid rgba(16, 42, 76, 0.08);
    }

    @keyframes page-enter {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .state-list {
      display: grid;
      gap: 6px;
    }

    .state-list a,
    .legend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-card-muted);
      text-decoration: none;
      color: var(--text);
      font-size: 13px;
      transition: background 0.1s ease, border-color 0.1s ease;
    }

    .state-list a:hover {
      background: var(--secondary-soft);
      border-color: var(--border-strong);
    }

    .legend-left {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    /* ── Gráficos ── */
    .line-chart {
      border-radius: var(--radius-md);
      background: var(--bg-card-muted);
      border: 1px solid var(--border);
    }

    /* ── Range picker ── */
    details.range-picker summary,
    .multi-select summary {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 42px;
      padding: 0 12px;
      list-style: none;
      cursor: pointer;
      color: var(--secondary);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-input-focus);
      font-size: 13px;
      font-weight: 600;
    }

    details.range-picker summary::-webkit-details-marker,
    .multi-select summary::-webkit-details-marker {
      display: none;
    }

    .range-popover {
      position: absolute;
      right: 0;

<script>
    window.stockiTheme = window.stockiTheme || (function () {
        var storageKey = "stocki.theme";
        var root = document.documentElement;
        var listeners = [];

        function current() {
            return root.getAttribute("data-theme") === "dark" ? "dark" : "light";
        }

        function apply(theme, persist) {
            var next = theme === "dark" ? "dark" : "light";
            root.setAttribute("data-theme", next);
            root.style.colorScheme = next;
            if (persist) {
                try {
                    window.localStorage.setItem(storageKey, next);
                } catch (_) {}
            }
            window.dispatchEvent(
                new CustomEvent("stocki:theme-change", {
                    detail: { theme: next },
                }),
            );
            listeners.forEach(function (listener) {
                listener(next);
            });
            return next;
        }

        return {
            get: current,
            set: function (theme) {
                return apply(theme, true);
            },
            toggle: function () {
                return apply(current() === "dark" ? "light" : "dark", true);
            },
            onChange: function (handler) {
                if (typeof handler === "function") listeners.push(handler);
            },
        };
    })();

    document.addEventListener("DOMContentLoaded", function () {
        function dismissMsg(el) {
            el.classList.add("msg-dismissing");
            el.addEventListener(
                "animationend",
                function () {
                    el.remove();
                },
                { once: true },
            );
        }
        function addCloseBtn(el) {
            var btn = document.createElement("button");
            btn.className = "msg-close";
            btn.type = "button";
            btn.setAttribute("aria-label", "Cerrar");
            btn.innerHTML = "&times;";
            btn.addEventListener("click", function () {
                dismissMsg(el);
            });
            el.appendChild(btn);
        }
        // Flash: close button + auto-dismiss after 6s
        document
            .querySelectorAll(".flash:not([data-persistent])")
            .forEach(function (el) {
                addCloseBtn(el);
                setTimeout(function () {
                    if (el.isConnected) dismissMsg(el);
                }, 6000);
            });
        // Alert (info): close button only, no auto-dismiss
        document
            .querySelectorAll(".alert:not([data-persistent])")
            .forEach(function (el) {
                addCloseBtn(el);
            });
    });
</script>
