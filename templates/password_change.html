<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{.Title}} · {{businessName .}}</title>
        <style>
            :root {
                color-scheme: light;
                --reset-bg: #f1eee6;
                --reset-card: #f8f5ee;
                --reset-text: #27241f;
                --reset-muted: #686259;
                --reset-border: #8f877a;
                --reset-primary: {{businessPrimaryColor .}};
                --reset-primary-contrast: {{businessPrimaryContrast .}};
                --reset-danger: #dc2626;
            }
            * { box-sizing: border-box; font-family: Inter, "Segoe UI", sans-serif; }
            body {
                min-height: 100vh;
                margin: 0;
                padding: 24px;
                display: grid;
                place-items: center;
                background: var(--reset-bg);
                color: var(--reset-text);
            }
            .reset-card {
                width: min(440px, 100%);
                padding: 32px;
                border: 1px solid var(--reset-border);
                border-radius: 8px;
                background: var(--reset-card);
                box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
            }
            .reset-card h1 { margin: 0 0 8px; font-size: 1.5rem; }
            .reset-card > p { margin: 0 0 24px; color: var(--reset-muted); line-height: 1.5; }
            .reset-error {
                margin-bottom: 16px;
                padding: 12px;
                border: 1px solid color-mix(in srgb, var(--reset-danger) 24%, transparent);
                border-radius: 8px;
                background: color-mix(in srgb, var(--reset-danger) 8%, white);
                color: var(--reset-danger);
                font-size: 0.875rem;
            }
            .reset-field { display: grid; gap: 8px; margin-bottom: 16px; }
            .reset-field label { font-size: 0.8rem; font-weight: 700; }
            .reset-field input {
                width: 100%;
                min-height: 44px;
                padding: 10px 12px;
                border: 1px solid var(--reset-border);
                border-radius: 8px;
                background: var(--reset-card);
                color: var(--reset-text);
                font-size: 1rem;
            }
            .reset-field input:focus {
                outline: 3px solid color-mix(in srgb, var(--reset-primary) 18%, transparent);
                border-color: var(--reset-primary);
            }
            .reset-hint { margin: -8px 0 20px; color: var(--reset-muted); font-size: 0.78rem; line-height: 1.45; }
            .reset-submit {
                width: 100%;
                min-height: 44px;
                border: 0;
                border-radius: 8px;
                background: var(--reset-primary);
                color: var(--reset-primary-contrast);
                font-weight: 700;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <main class="reset-card">
            <h1>{{.Title}}</h1>
            <p>Ingresaste con una contraseña temporal. Debes reemplazarla antes de continuar en StockiAPP.</p>
            {{if .Error}}<div class="reset-error">{{.Error}}</div>{{end}}
            <form method="POST" action="/password/change">
                <div class="reset-field">
                    <label for="new-password">Nueva contraseña</label>
                    <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="10" required />
                </div>
                <div class="reset-field">
                    <label for="password-confirm">Confirmar contraseña</label>
                    <input id="password-confirm" name="password_confirm" type="password" autocomplete="new-password" minlength="10" required />
                </div>
                <p class="reset-hint">Usa mínimo 10 caracteres e incluye mayúscula, minúscula y número.</p>
                <button class="reset-submit" type="submit">Guardar y continuar</button>
            </form>
        </main>
    </body>
</html>
