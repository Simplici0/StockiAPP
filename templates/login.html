<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{.Title}} · {{businessName .}}</title>
        <link rel="icon" href="{{businessLogoPath .}}" />
        <link rel="shortcut icon" href="{{businessLogoPath .}}" />
        <link rel="apple-touch-icon" href="{{businessLogoPath .}}" />
        <script>
            (function () {
                var root = document.documentElement;
                var theme = "light";
                try {
                    var saved = window.localStorage.getItem("stocki.theme");
                    if (saved === "light" || saved === "dark") {
                        theme = saved;
                    } else if (
                        window.matchMedia &&
                        window.matchMedia("(prefers-color-scheme: dark)").matches
                    ) {
                        theme = "dark";
                    }
                } catch (_) {}
                root.setAttribute("data-theme", theme);
                root.style.colorScheme = theme;
            })();
        </script>
        <style>
            :root {
              color-scheme: light;
              --bg-base: #f8fafc;
              --card: #ffffff;
              --card-muted: #f1f5f9;
              --text: #1e293b;
              --muted: #64748b;
              --primary: {{businessPrimaryColor .}};
              --primary-hover: {{businessPrimaryStrong .}};
              --border: #e2e8f0;
              --border-strong: #cbd5e1;
              --danger: #dc2626;
              --shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
            }

            :root[data-theme="dark"] {
              color-scheme: dark;
              --bg-base: #060e20;
              --card: #16213e;
              --card-muted: #0f1930;
              --text: #dee5ff;
              --muted: #9fb0c5;
              --border: rgba(170, 193, 226, 0.16);
              --border-strong: rgba(170, 193, 226, 0.24);
              --danger: #ffb4b4;
              --shadow: 0 20px 44px rgba(1, 6, 14, 0.36);
            }

            * {
              box-sizing: border-box;
              font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }

            body {
              margin: 0;
              background: var(--bg-base);
              color: var(--text);
              display: flex;
              align-items: center;
              justify-content: center;
              min-height: 100vh;
              padding: 24px;
            }

            .card {
              width: 100%;
              max-width: 392px;
              background: var(--card);
              border-radius: 18px;
              border: 1px solid var(--border);
              padding: 28px;
              box-shadow: var(--shadow);
              position: relative;
              animation: fadeInUp 0.45s ease-out;
            }

            :root[data-theme="dark"] .card {
              border-color: var(--border);
            }

            @keyframes fadeInUp {
              from {
                opacity: 0;
                transform: translateY(20px);
              }
              to {
                opacity: 1;
                transform: translateY(0);
              }
            }

            h1 {
              margin: 0 0 6px;
              font-size: 24px;
              font-weight: 700;
              letter-spacing: -0.03em;
              line-height: 1.1;
            }

            p {
              margin: 0 0 20px;
              color: var(--muted);
              line-height: 1.45;
              font-size: 14px;
            }

            label {
              display: block;
              font-size: 11.5px;
              text-transform: uppercase;
              letter-spacing: 0.08em;
              margin-bottom: 6px;
              color: var(--text);
              font-weight: 800;
            }

            input {
              width: 100%;
              padding: 12px 13px;
              border-radius: 11px;
              border: 1px solid var(--border-strong);
              font-size: 14px;
              margin-bottom: 14px;
              background: var(--card);
              color: var(--text);
              transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
            }

            input::placeholder {
              color: var(--muted);
              opacity: 1;
            }

            input:focus {
              outline: none;
              border-color: var(--primary);
              box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 16%, transparent);
            }

            input:hover {
              border-color: var(--border-strong);
            }

            button {
              width: 100%;
              border: none;
              padding: 12px 16px;
              border-radius: 11px;
              font-weight: 600;
              background: var(--primary);
              color: white;
              cursor: pointer;
              font-size: 14px;
              transition: transform 0.18s ease, opacity 0.18s ease, box-shadow 0.18s ease;
              box-shadow: 0 10px 24px color-mix(in srgb, var(--primary) 22%, transparent);
              position: relative;
              overflow: hidden;
            }

            button:hover {
              transform: translateY(-1px);
              opacity: 0.98;
            }

            button:active {
              transform: translateY(0);
              box-shadow: 0 6px 18px color-mix(in srgb, var(--primary) 18%, transparent);
            }

            .error {
              background: color-mix(in srgb, var(--danger) 10%, var(--card));
              border: 1px solid color-mix(in srgb, var(--danger) 24%, var(--border));
              color: var(--danger);
              padding: 11px 13px;
              border-radius: 11px;
              font-size: 13px;
              margin-bottom: 14px;
              font-weight: 650;
              animation: shake 0.3s ease;
            }

            @keyframes shake {
              0%, 100% { transform: translateX(0); }
              25% { transform: translateX(-8px); }
              75% { transform: translateX(8px); }
            }

            .brand {
              display: flex;
              align-items: center;
              gap: 12px;
              margin-bottom: 18px;
            }

            .brand-logo {
              width: 44px;
              height: 44px;
              border-radius: 12px;
              background: var(--card);
              border: 1px solid var(--border);
              display: flex;
              align-items: center;
              justify-content: center;
              overflow: hidden;
              box-shadow: 0 6px 14px rgba(15, 23, 42, 0.04);
              flex: 0 0 auto;
            }

            .brand-logo img {
              max-width: 100%;
              max-height: 100%;
              object-fit: contain;
              display: block;
            }

            .brand-copy {
              display: grid;
              gap: 3px;
            }

            .brand-copy strong {
              color: var(--text);
              font-size: 17px;
              line-height: 1.1;
            }

            .brand-copy span {
              color: var(--muted);
              font-size: 11px;
              text-transform: uppercase;
              letter-spacing: 0.08em;
              font-weight: 700;
            }

            .theme-toggle {
              position: fixed;
              top: 16px;
              right: 16px;
              width: 48px;
              min-width: 48px;
              height: 30px;
              padding: 3px;
              border-radius: 999px;
              border: 1px solid var(--border);
              background: var(--card);
              display: inline-flex;
              align-items: center;
              justify-content: flex-start;
              cursor: pointer;
              z-index: 2;
              box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
              transition: background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
            }

            .theme-toggle:hover {
              border-color: var(--border-strong);
              box-shadow: 0 10px 22px rgba(15, 23, 42, 0.12);
            }

            .theme-toggle:focus-visible {
              outline: none;
              box-shadow:
                0 0 0 4px color-mix(in srgb, var(--primary) 16%, transparent),
                0 10px 22px rgba(15, 23, 42, 0.12);
            }

            .theme-toggle-thumb {
              width: 22px;
              height: 22px;
              border-radius: 999px;
              border: 1px solid rgba(15, 40, 80, 0.08);
              background:
                radial-gradient(circle at 34% 34%, rgba(255,255,255,0.98) 0%, rgba(244, 247, 252, 0.98) 62%, rgba(216, 226, 241, 0.98) 100%);
              box-shadow:
                0 6px 14px rgba(15, 40, 80, 0.16),
                inset 0 1px 0 rgba(255, 255, 255, 0.92);
              position: relative;
              transform: translateX(0);
              transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
            }

            .theme-toggle-thumb::before,
            .theme-toggle-thumb::after {
              content: '';
              position: absolute;
              border-radius: 999px;
              transition: opacity 0.18s ease, transform 0.18s ease;
            }

            .theme-toggle-thumb::before {
              width: 9px;
              height: 9px;
              top: 50%;
              left: 50%;
              transform: translate(-50%, -50%) scale(1);
              background: rgba(255, 211, 89, 0.96);
              box-shadow: 0 0 0 4px rgba(255, 211, 89, 0.18);
              opacity: 1;
            }

            .theme-toggle-thumb::after {
              width: 11px;
              height: 11px;
              top: 50%;
              left: 50%;
              transform: translate(-50%, -50%) scale(0.7);
              background: rgba(172, 200, 255, 0.96);
              box-shadow: 4px -2px 0 0 rgba(12, 21, 34, 0.88);
              opacity: 0;
            }

            :root[data-theme="dark"] .theme-toggle {
              border-color: rgba(170, 193, 226, 0.16);
              background: rgba(12, 21, 34, 0.92);
              box-shadow: 0 10px 22px rgba(1, 6, 14, 0.28);
            }

            :root[data-theme="dark"] .theme-toggle:hover {
              border-color: rgba(170, 193, 226, 0.22);
              box-shadow: 0 12px 24px rgba(1, 6, 14, 0.34), 0 0 0 4px rgba(79, 167, 255, 0.1);
            }

            :root[data-theme="dark"] .theme-toggle-thumb {
              transform: translateX(18px);
              border-color: rgba(170, 193, 226, 0.18);
              background:
                radial-gradient(circle at 34% 34%, rgba(233, 242, 255, 0.98) 0%, rgba(208, 223, 247, 0.98) 58%, rgba(170, 193, 226, 0.98) 100%);
            }

            :root[data-theme="dark"] .theme-toggle-thumb::before {
              transform: translate(-50%, -50%) scale(0.7);
              opacity: 0;
            }

            :root[data-theme="dark"] .theme-toggle-thumb::after {
              transform: translate(-50%, -50%) scale(1);
              opacity: 1;
            }

            @media (max-width: 640px) {
              .theme-toggle {
                top: 14px;
                right: 14px;
              }

              .card {
                padding: 24px;
              }
            }
        </style>
    </head>
    <body>
        <button
            class="theme-toggle"
            type="button"
            id="login-theme-toggle"
            aria-label="Cambiar tema"
            title="Cambiar tema"
        >
            <span class="theme-toggle-thumb" aria-hidden="true"></span>
        </button>
        <div class="card">
            <div class="brand">
                <div class="brand-logo">
                    <img
                        src="{{businessLogoPath .}}"
                        alt="Logo de {{businessName .}}"
                    />
                </div>
                <div class="brand-copy">
                    <strong>{{businessName .}}</strong>
                </div>
            </div>
            <h1>{{.Title}}</h1>
            <p>Inicia sesión para continuar.</p>
            {{if .Error}}
            <div class="error">{{.Error}}</div>
            {{end}}
            <form method="POST" action="/login">
                <label for="username">Usuario</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    value="{{.Username}}"
                    required
                />
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" required />
                <button type="submit">Entrar</button>
            </form>
        </div>
        <script>
            (function () {
                var toggle = document.getElementById("login-theme-toggle");
                if (!toggle) return;
                var syncLabel = function () {
                    var current = document.documentElement.getAttribute("data-theme");
                    var isDark = current === "dark";
                    toggle.setAttribute("aria-pressed", isDark ? "true" : "false");
                    toggle.setAttribute(
                        "aria-label",
                        isDark ? "Cambiar a modo claro" : "Cambiar a modo oscuro"
                    );
                    toggle.setAttribute(
                        "title",
                        isDark ? "Cambiar a modo claro" : "Cambiar a modo oscuro"
                    );
                };
                syncLabel();
                toggle.addEventListener("click", function () {
                    var root = document.documentElement;
                    var next =
                        root.getAttribute("data-theme") === "dark"
                            ? "light"
                            : "dark";
                    root.setAttribute("data-theme", next);
                    root.style.colorScheme = next;
                    try {
                        window.localStorage.setItem("stocki.theme", next);
                    } catch (_) {}
                    syncLabel();
                });
            })();
        </script>
    </body>
</html>
