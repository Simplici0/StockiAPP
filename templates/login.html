<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{.Title}} · {{businessName .}}</title>
        <link rel="icon" href="{{businessLogoPath .}}" />
        <link rel="shortcut icon" href="{{businessLogoPath .}}" />
        <link rel="apple-touch-icon" href="{{businessLogoPath .}}" />
        <script>
            (function () {
                var root = document.documentElement;
                var theme = "light";
                try {
                    var saved = window.localStorage.getItem("stocki.theme");
                    if (saved === "light" || saved === "dark") {
                        theme = saved;
                    } else if (
                        window.matchMedia &&
                        window.matchMedia("(prefers-color-scheme: dark)").matches
                    ) {
                        theme = "dark";
                    }
                } catch (_) {}
                root.setAttribute("data-theme", theme);
                root.style.colorScheme = theme;
            })();
        </script>
        <style>
            :root {
              color-scheme: light;
              --bg-base: #f6f4f1;
              --card: #ffffff;
              --text: #2a2826;
              --muted: #6b6560;
              --primary: {{businessPrimaryColor .}};
              --primary-hover: {{businessPrimaryStrong .}};
              --border: #e8e4df;
              --danger: #d64545;
            }

            :root[data-theme="dark"] {
              color-scheme: dark;
              --bg-base: #07121d;
              --card: rgba(12, 21, 34, 0.94);
              --text: #e8eef7;
              --muted: #9fb0c5;
              --border: rgba(170, 193, 226, 0.14);
              --danger: #ff8d8d;
            }

            * {
              box-sizing: border-box;
              font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }

            body {
              margin: 0;
              background: linear-gradient(135deg, #faf8f5 0%, #f0ebe4 100%);
              color: var(--text);
              display: flex;
              align-items: center;
              justify-content: center;
              min-height: 100vh;
              padding: 24px;
              position: relative;
              overflow: hidden;
            }

            :root[data-theme="dark"] body {
              background: linear-gradient(135deg, #08131f 0%, #0f2235 100%);
            }

            body::before {
              content: '';
              position: absolute;
              width: 500px;
              height: 500px;
              background: radial-gradient(circle, rgba(232, 93, 60, 0.08) 0%, transparent 70%);
              top: -150px;
              right: -150px;
              border-radius: 50%;
              pointer-events: none;
            }

            body::after {
              content: '';
              position: absolute;
              width: 400px;
              height: 400px;
              background: radial-gradient(circle, rgba(232, 93, 60, 0.05) 0%, transparent 70%);
              bottom: -100px;
              left: -100px;
              border-radius: 50%;
              pointer-events: none;
            }

            .card {
              width: 100%;
              max-width: 420px;
              background: rgba(255, 255, 255, 0.95);
              backdrop-filter: blur(10px);
              border-radius: 20px;
              border: 1px solid rgba(232, 223, 216, 0.6);
              padding: 32px;
              box-shadow:
                0 20px 60px rgba(42, 40, 38, 0.08),
                0 4px 12px rgba(42, 40, 38, 0.04);
              position: relative;
              animation: fadeInUp 0.6s ease-out;
            }

            :root[data-theme="dark"] .card {
              background: rgba(12, 21, 34, 0.94);
              border-color: rgba(170, 193, 226, 0.12);
              box-shadow:
                0 24px 60px rgba(1, 6, 14, 0.42),
                0 4px 12px rgba(1, 6, 14, 0.18);
            }

            @keyframes fadeInUp {
              from {
                opacity: 0;
                transform: translateY(20px);
              }
              to {
                opacity: 1;
                transform: translateY(0);
              }
            }

            h1 {
              margin: 0 0 8px;
              font-size: 26px;
              font-weight: 700;
              letter-spacing: -0.02em;
              line-height: 1.2;
            }

            p {
              margin: 0 0 24px;
              color: var(--muted);
              line-height: 1.5;
              font-size: 14px;
            }

            label {
              display: block;
              font-size: 11px;
              text-transform: uppercase;
              letter-spacing: 0.06em;
              margin-bottom: 8px;
              color: var(--muted);
              font-weight: 600;
            }

            input {
              width: 100%;
              padding: 12px 14px;
              border-radius: 12px;
              border: 1.5px solid var(--border);
              font-size: 14px;
              margin-bottom: 18px;
              background: #ffffff;
              transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            }

            input:focus {
              outline: none;
              border-color: var(--primary);
              box-shadow: 0 0 0 3px rgba(232, 93, 60, 0.12);
              transform: translateY(-1px);
            }

            input:hover {
              border-color: rgba(232, 93, 60, 0.3);
            }

            :root[data-theme="dark"] input {
              background: rgba(13, 24, 38, 0.96);
              color: var(--text);
            }

            button {
              width: 100%;
              border: none;
              padding: 13px 16px;
              border-radius: 12px;
              font-weight: 600;
              background: linear-gradient(135deg, var(--primary) 0%, #d85038 100%);
              color: white;
              cursor: pointer;
              font-size: 14px;
              transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
              box-shadow:
                0 4px 12px rgba(232, 93, 60, 0.25),
                0 2px 4px rgba(232, 93, 60, 0.15);
              position: relative;
              overflow: hidden;
            }

            button::before {
              content: '';
              position: absolute;
              top: 0;
              left: 0;
              width: 100%;
              height: 100%;
              background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0) 100%);
              opacity: 0;
              transition: opacity 0.3s ease;
            }

            button:hover {
              transform: translateY(-2px);
              box-shadow:
                0 8px 20px rgba(232, 93, 60, 0.3),
                0 4px 8px rgba(232, 93, 60, 0.2);
            }

            button:hover::before {
              opacity: 1;
            }

            button:active {
              transform: translateY(0);
              box-shadow:
                0 2px 8px rgba(232, 93, 60, 0.25),
                0 1px 3px rgba(232, 93, 60, 0.15);
            }

            .error {
              background: linear-gradient(135deg, #fff5f5 0%, #ffe8e8 100%);
              border: 1.5px solid #ffcaca;
              color: var(--danger);
              padding: 12px 14px;
              border-radius: 12px;
              font-size: 13px;
              margin-bottom: 18px;
              font-weight: 500;
              animation: shake 0.4s ease;
            }

            @keyframes shake {
              0%, 100% { transform: translateX(0); }
              25% { transform: translateX(-8px); }
              75% { transform: translateX(8px); }
            }

            .brand {
              display: flex;
              align-items: center;
              gap: 12px;
              margin-bottom: 24px;
            }

            .brand-logo {
              width: 48px;
              height: 48px;
              border-radius: 14px;
              background: #ffffff;
              border: 1px solid rgba(15, 40, 80, 0.08);
              display: flex;
              align-items: center;
              justify-content: center;
              overflow: hidden;
              box-shadow: 0 8px 18px rgba(15, 40, 80, 0.06);
              flex: 0 0 auto;
            }

            .brand-logo img {
              max-width: 100%;
              max-height: 100%;
              object-fit: contain;
              display: block;
            }

            .brand-copy {
              display: grid;
              gap: 4px;
            }

            .brand-copy strong {
              color: var(--text);
              font-size: 18px;
              line-height: 1.1;
            }

            .brand-copy span {
              color: var(--muted);
              font-size: 12px;
              text-transform: uppercase;
              letter-spacing: 0.08em;
              font-weight: 700;
            }

            .theme-toggle {
              position: fixed;
              top: 18px;
              right: 18px;
              width: 52px;
              min-width: 52px;
              height: 32px;
              padding: 3px;
              border-radius: 999px;
              border: 1px solid rgba(15, 40, 80, 0.12);
              background: rgba(255, 255, 255, 0.76);
              display: inline-flex;
              align-items: center;
              justify-content: flex-start;
              cursor: pointer;
              z-index: 2;
              box-shadow:
                0 12px 28px rgba(15, 40, 80, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.72);
              transition: background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
              backdrop-filter: blur(12px);
            }

            .theme-toggle:hover {
              border-color: rgba(15, 40, 80, 0.18);
              box-shadow:
                0 14px 32px rgba(15, 40, 80, 0.14),
                0 0 0 4px rgba(232, 93, 60, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.82);
            }

            .theme-toggle:focus-visible {
              outline: none;
              box-shadow:
                0 0 0 4px rgba(232, 93, 60, 0.14),
                0 14px 32px rgba(15, 40, 80, 0.14),
                inset 0 1px 0 rgba(255, 255, 255, 0.82);
            }

            .theme-toggle-thumb {
              width: 24px;
              height: 24px;
              border-radius: 999px;
              border: 1px solid rgba(15, 40, 80, 0.08);
              background:
                radial-gradient(circle at 34% 34%, rgba(255,255,255,0.98) 0%, rgba(244, 247, 252, 0.98) 62%, rgba(216, 226, 241, 0.98) 100%);
              box-shadow:
                0 8px 18px rgba(15, 40, 80, 0.16),
                inset 0 1px 0 rgba(255, 255, 255, 0.92);
              position: relative;
              transform: translateX(0);
              transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
            }

            .theme-toggle-thumb::before,
            .theme-toggle-thumb::after {
              content: '';
              position: absolute;
              border-radius: 999px;
              transition: opacity 0.18s ease, transform 0.18s ease;
            }

            .theme-toggle-thumb::before {
              width: 9px;
              height: 9px;
              top: 50%;
              left: 50%;
              transform: translate(-50%, -50%) scale(1);
              background: rgba(255, 211, 89, 0.96);
              box-shadow: 0 0 0 4px rgba(255, 211, 89, 0.18);
              opacity: 1;
            }

            .theme-toggle-thumb::after {
              width: 11px;
              height: 11px;
              top: 50%;
              left: 50%;
              transform: translate(-50%, -50%) scale(0.7);
              background: rgba(172, 200, 255, 0.96);
              box-shadow: 4px -2px 0 0 rgba(12, 21, 34, 0.88);
              opacity: 0;
            }

            :root[data-theme="dark"] .theme-toggle {
              border-color: rgba(170, 193, 226, 0.16);
              background: rgba(12, 21, 34, 0.8);
              box-shadow:
                0 16px 34px rgba(1, 6, 14, 0.28),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            }

            :root[data-theme="dark"] .theme-toggle:hover {
              border-color: rgba(170, 193, 226, 0.22);
              box-shadow:
                0 18px 36px rgba(1, 6, 14, 0.32),
                0 0 0 4px rgba(79, 167, 255, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            }

            :root[data-theme="dark"] .theme-toggle-thumb {
              transform: translateX(20px);
              border-color: rgba(170, 193, 226, 0.18);
              background:
                radial-gradient(circle at 34% 34%, rgba(233, 242, 255, 0.98) 0%, rgba(208, 223, 247, 0.98) 58%, rgba(170, 193, 226, 0.98) 100%);
            }

            :root[data-theme="dark"] .theme-toggle-thumb::before {
              transform: translate(-50%, -50%) scale(0.7);
              opacity: 0;
            }

            :root[data-theme="dark"] .theme-toggle-thumb::after {
              transform: translate(-50%, -50%) scale(1);
              opacity: 1;
            }

            @media (max-width: 640px) {
              .theme-toggle {
                top: 14px;
                right: 14px;
              }
            }
        </style>
    </head>
    <body>
        <button
            class="theme-toggle"
            type="button"
            id="login-theme-toggle"
            aria-label="Cambiar tema"
            title="Cambiar tema"
        >
            <span class="theme-toggle-thumb" aria-hidden="true"></span>
        </button>
        <div class="card">
            <div class="brand">
                <div class="brand-logo">
                    <img
                        src="{{businessLogoPath .}}"
                        alt="Logo de {{businessName .}}"
                    />
                </div>
                <div class="brand-copy">
                    <span>Acceso</span>
                    <strong>{{businessName .}}</strong>
                </div>
            </div>
            <h1>{{.Title}}</h1>
            <p>Inicia sesión para continuar.</p>
            {{if .Error}}
            <div class="error">{{.Error}}</div>
            {{end}}
            <form method="POST" action="/login">
                <label for="username">Usuario</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    value="{{.Username}}"
                    required
                />
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" required />
                <button type="submit">Entrar</button>
            </form>
        </div>
        <script>
            (function () {
                var toggle = document.getElementById("login-theme-toggle");
                if (!toggle) return;
                var syncLabel = function () {
                    var current = document.documentElement.getAttribute("data-theme");
                    var isDark = current === "dark";
                    toggle.setAttribute("aria-pressed", isDark ? "true" : "false");
                    toggle.setAttribute(
                        "aria-label",
                        isDark ? "Cambiar a modo claro" : "Cambiar a modo oscuro"
                    );
                    toggle.setAttribute(
                        "title",
                        isDark ? "Cambiar a modo claro" : "Cambiar a modo oscuro"
                    );
                };
                syncLabel();
                toggle.addEventListener("click", function () {
                    var root = document.documentElement;
                    var next =
                        root.getAttribute("data-theme") === "dark"
                            ? "light"
                            : "dark";
                    root.setAttribute("data-theme", next);
                    root.style.colorScheme = next;
                    try {
                        window.localStorage.setItem("stocki.theme", next);
                    } catch (_) {}
                    syncLabel();
                });
            })();
        </script>
    </body>
</html>
