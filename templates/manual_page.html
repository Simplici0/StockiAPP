<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{.Title}}</title>
        {{template "app_styles" .}}
        <style>
            .manual-page {
                display: grid;
                gap: 16px;
            }

            .manual-frame-wrap {
                border-radius: var(--radius-lg);
                overflow: hidden;
                border: 1px solid var(--border);
                background: var(--bg-card);
                box-shadow: var(--shadow-sm);
                min-height: calc(100vh - 140px);
            }

            .manual-frame {
                width: 100%;
                min-height: calc(100vh - 140px);
                border: 0;
                display: block;
                background: var(--bg-card-muted);
            }

            @media (max-width: 900px) {
                .manual-frame-wrap,
                .manual-frame {
                    min-height: calc(100vh - 118px);
                }
            }
        </style>
    </head>
    <body>
        {{template "header" .}}
        <main class="page-content manual-page">
            <section class="manual-frame-wrap" aria-label="Manual de usuario">
                <iframe
                    class="manual-frame"
                    src="{{.FrameURL}}"
                    title="Manual de usuario StockiAPP"
                    loading="lazy"
                ></iframe>
            </section>
        </main>
    </body>
</html>
