<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{.Title}}</title>
        {{template "app_styles" .}}
    </head>
    <body>
        {{template "header" .}}
        <main class="page-content manual-page">
            <section class="manual-frame-wrap" aria-label="Manual de usuario">
                <iframe
                    class="manual-frame"
                    src="{{.FrameURL}}"
                    title="Manual de usuario StockiAPP"
                    loading="lazy"
                ></iframe>
            </section>
        </main>
    </body>
</html>
